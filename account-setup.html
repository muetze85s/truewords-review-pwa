<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0b1220">
  <meta name="robots" content="noindex,nofollow">
  <title>TrueWords · Konten einrichten</title>
  <link rel="stylesheet" href="./portal.css">
</head>
<body>
  <main class="page">
    <section class="login-shell card">
      <div class="eyebrow">Einmalige Einrichtung</div>
      <h1>Konten anlegen</h1>
      <p class="intro">Hier werden die beiden E-Mail-/Passwortkonten eingerichtet. Passwörter werden nur als Hash gespeichert.</p>

      <form id="setup-form">
        <label>
          <span>Admin-Zugangscode</span>
          <input id="admin-token" type="password" autocomplete="off" required>
        </label>
        <div class="grid">
          <label>
            <span>Philipps E-Mail</span>
            <input id="philipp-email" type="email" autocomplete="off" required>
          </label>
          <label>
            <span>Philipps Passwort</span>
            <input id="philipp-password" type="password" minlength="12" autocomplete="new-password" required>
          </label>
        </div>
        <div class="grid">
          <label>
            <span>Lenas E-Mail</span>
            <input id="lena-email" type="email" autocomplete="off" required>
          </label>
          <label>
            <span>Lenas Passwort</span>
            <input id="lena-password" type="password" minlength="12" autocomplete="new-password" required>
          </label>
        </div>
        <button id="submit" class="primary" type="submit">Konten speichern</button>
      </form>

      <div id="status" class="status" role="status" aria-live="polite">Noch nicht eingerichtet.</div>
      <p class="muted" style="margin-top:12px;font-size:12px">Eine erneute Einrichtung ersetzt beide Konten und meldet bestehende Sitzungen ab.</p>
    </section>
  </main>
  <script src="./account-setup.js"></script>
</body>
</html>
