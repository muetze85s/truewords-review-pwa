<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0b1220">
  <meta name="description" content="TrueWords Prüf-PWA zur manuellen Prüfung von Gesprächssituationen aus dem Jahr 2026.">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./icon.svg" type="image/svg+xml">
  <title>TrueWords · Situationsprüfung 2026</title>
  <style>
    :root{color-scheme:dark;--bg:#08101c;--panel:#101a2b;--panel2:#162238;--line:#2b3a55;--text:#edf3ff;--muted:#9fb0ca;--accent:#6ea8fe;--good:#4dd4a7;--warn:#f3c96b;--bad:#ff7b86}
    *{box-sizing:border-box}body{margin:0;background:linear-gradient(180deg,#07101c,#0d1727);color:var(--text);font-family:ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;font-size:15px}
    button,input,select,textarea{font:inherit}button,.file{border:1px solid var(--line);background:#162238;color:var(--text);border-radius:10px;padding:10px 12px;cursor:pointer}button:hover,.file:hover{border-color:#55739f}.primary{background:#1f5fae;border-color:#377dcc}.danger{border-color:#8a3e4a;color:#ffd5d8}.small{padding:7px 9px;font-size:13px}.file input{display:none}
    header{position:sticky;top:0;z-index:20;display:flex;justify-content:space-between;gap:12px;align-items:center;padding:12px 16px;background:#08101ceF;border-bottom:1px solid var(--line);backdrop-filter:blur(12px)}
    h1,h2,h3,p{margin:0}.brand{display:flex;gap:10px;align-items:center}.logo{width:40px;height:40px;border-radius:12px;background:#1f5fae;display:grid;place-items:center;font-weight:800}.eyebrow{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}h1{font-size:20px}.actions{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
    .scope{padding:10px 16px;background:#101a2b;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;color:var(--muted)}
    .metrics{display:grid;grid-template-columns:repeat(6,minmax(120px,1fr));gap:10px;padding:12px 16px}.metric{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px}.metric span,.metric small{display:block;color:var(--muted);font-size:12px}.metric strong{display:block;font-size:22px;margin:4px 0}
    .workspace{display:grid;grid-template-columns:280px minmax(420px,1fr) 320px;gap:12px;padding:0 16px 24px}.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;overflow:hidden;min-height:200px}.panelhead{display:flex;justify-content:space-between;align-items:center;padding:12px 14px;border-bottom:1px solid var(--line)}.panelbody{padding:12px}.count{background:#22324e;border-radius:999px;padding:4px 8px;color:#cfe0ff}.list{max-height:calc(100vh - 245px);overflow:auto}.sit{width:100%;text-align:left;border:0;border-bottom:1px solid var(--line);border-radius:0;background:transparent;padding:11px 12px}.sit.active{background:#1a3154}.sit small,.sit span{display:block;color:var(--muted);margin-top:3px}.sit.control{border-left:4px solid var(--warn)}.sit.unclear{border-left:4px solid var(--bad)}.sit.training{border-left:4px solid var(--good)}
    .toolbar,.bulk,.pager{display:flex;gap:8px;align-items:center;justify-content:space-between;padding:10px 12px;border-bottom:1px solid var(--line);flex-wrap:wrap}.search{display:flex;gap:8px;flex:1}.search input{width:100%;min-width:180px;background:#0c1524;color:var(--text);border:1px solid var(--line);border-radius:10px;padding:9px}.field{display:grid;gap:5px;color:var(--muted);font-size:12px}.field input,.field select,.field textarea,select.assign{background:#0c1524;color:var(--text);border:1px solid var(--line);border-radius:8px;padding:8px}.messages{padding:8px;max-height:calc(100vh - 290px);overflow:auto}.day{text-align:center;color:var(--muted);margin:10px 0;font-size:12px}.message{display:grid;grid-template-columns:1fr 190px;gap:10px;border:1px solid var(--line);border-radius:12px;padding:10px;margin:8px 0;background:#0d1727}.message.excluded{opacity:.48}.message.range{outline:2px solid #397bd0}.message.selected{border-color:var(--accent)}.meta{display:flex;gap:8px;flex-wrap:wrap;color:var(--muted);font-size:12px}.meta strong{color:var(--text)}.text{white-space:pre-wrap;overflow-wrap:anywhere;margin-top:7px;line-height:1.42}.reply{margin-top:6px;padding:7px 9px;border-left:3px solid #55739f;background:#132038;color:#b9c8de;font-size:13px}.flags{display:flex;gap:5px;flex-wrap:wrap;margin-top:7px}.flag{font-size:11px;background:#1b2941;color:#b9c8de;border-radius:999px;padding:3px 7px}.assignbox{display:grid;gap:7px;align-content:start}.assignbox select{width:100%}.assignbuttons{display:flex;gap:6px}.boundary{padding:5px 10px;margin:5px 0;border-radius:8px;font-size:12px}.boundary.start{background:#123b32;color:#8ff1d2}.boundary.end{background:#3f2730;color:#ffb8c0}
    .editorgrid{display:grid;gap:10px}.feature{display:grid;grid-template-columns:1fr auto;gap:8px;padding:8px 0;border-bottom:1px solid var(--line)}.muted{color:var(--muted)}.notice{padding:10px;border:1px solid #685b35;background:#2a2517;border-radius:10px;color:#f4d887;line-height:1.4}.privacy{font-size:12px;color:var(--muted);line-height:1.45;margin-top:12px}.empty{max-width:760px;margin:8vh auto;padding:20px}.empty .panelbody{display:grid;gap:16px;padding:24px}.chips{display:flex;flex-wrap:wrap;gap:7px}.chips span{background:#1b2941;padding:6px 9px;border-radius:999px;color:#c4d3e9;font-size:12px}
    @media(max-width:1150px){.workspace{grid-template-columns:240px 1fr}.editor{grid-column:1/-1}.editor .panelbody{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.metrics{grid-template-columns:repeat(3,1fr)}}
    @media(max-width:760px){header{position:static;align-items:flex-start;flex-direction:column}.actions{justify-content:flex-start}.metrics{grid-template-columns:repeat(2,1fr)}.workspace{grid-template-columns:1fr;padding:0 8px 20px}.list,.messages{max-height:none}.message{grid-template-columns:1fr}.editor{grid-column:auto}.editor .panelbody{display:block}.scope{font-size:12px}.panel{border-radius:10px}}
  </style>
</head>
<body>
<div id="app"></div>
<script>
(() => {
  'use strict';
  const YEAR=2026,PAGE_SIZE=120,STORE='truewords-review-2026/';
  const state={dataset:null,messages:[],situations:[],assign:new Map(),events:[],page:0,query:'',showExcluded:false,start:null,end:null,selected:null,reviewer:localStorage.getItem(STORE+'reviewer')||'Philipp'};
  const app=document.getElementById('app');
  if('serviceWorker' in navigator) addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));

  function render(){
    if(!state.dataset){app.innerHTML=emptyView();bindGlobal();return}
    const visible=getVisible(); const pages=Math.max(1,Math.ceil(visible.length/PAGE_SIZE)); state.page=Math.min(state.page,pages-1);
    const rows=visible.slice(state.page*PAGE_SIZE,(state.page+1)*PAGE_SIZE); const stats=getStats(); const sit=getSelected();
    app.innerHTML=`
      <header><div class="brand"><div class="logo">TW</div><div><div class="eyebrow">Eigenständige Prüf-PWA</div><h1>Situationsprüfung 2026</h1></div></div><div class="actions">
        <label class="file primary">Chat laden<input id="chat" type="file" accept=".json,application/json"></label>
        <label class="file">Markierungen laden<input id="ann" type="file" accept=".json,application/json"></label>
        <button id="exp">Markierungen exportieren</button><button id="train">Algorithmus-Daten</button>
      </div></header>
      <div class="scope"><span><strong>${esc(state.dataset.label)}</strong> · nur lokal im Browser</span><span>Prüfer: <select id="reviewer"><option ${state.reviewer==='Philipp'?'selected':''}>Philipp</option><option ${state.reviewer==='Lena'?'selected':''}>Lena</option></select> · Zeitraum 01.01.–31.12.2026</span></div>
      <section class="metrics">${metric('Sichtbare Nachrichten',stats.included,'nach lokaler Bereinigung')}${metric('Situationen',state.situations.length,'fortlaufend nummeriert')}${metric('Zugeordnet',stats.assigned,stats.coverage+' % Abdeckung')}${metric('Offen',stats.unassigned,'noch nicht zugeordnet')}${metric('Training',stats.training,'Regelableitung')}${metric('Kontrolle',stats.control,'zur späteren Prüfung')}</section>
      <main class="workspace">
        <aside class="panel"><div class="panelhead"><div><div class="eyebrow">Referenz</div><h2>Situationen</h2></div><span class="count">${state.situations.length}</span></div><div class="panelbody"><button id="emptySit" class="primary" style="width:100%">Neue leere Situation</button></div><div class="list">${state.situations.length?state.situations.map(sitItem).join(''):'<div class="panelbody muted">Noch keine Situation angelegt.</div>'}</div></aside>
        <section class="panel"><div class="toolbar"><div class="search"><input id="search" placeholder="Text oder Nachrichten-ID suchen" value="${attr(state.query)}"><button id="clear" class="small">Leeren</button></div><button id="make" class="primary small" ${canRange()?'':'disabled'}>Bereich als neue Situation</button></div>
          <div class="bulk"><span>${rangeText()}</span><span><button id="reset" class="small">Auswahl löschen</button> <label><input id="excluded" type="checkbox" ${state.showExcluded?'checked':''}> ausgeschlossene anzeigen</label></span></div>
          <div class="pager"><span>Seite ${state.page+1}/${pages} · ${visible.length} Treffer</span><span><button id="prev" class="small" ${state.page===0?'disabled':''}>Zurück</button> <button id="next" class="small" ${state.page>=pages-1?'disabled':''}>Weiter</button></span></div>
          <div class="messages">${rows.length?messageRows(rows):'<div class="panelbody muted">Keine Nachrichten gefunden.</div>'}</div>
        </section>
        <aside class="panel editor"><div class="panelhead"><div><div class="eyebrow">Aktive Auswahl</div><h2>${sit?'Situation '+sit.id:'Keine Situation gewählt'}</h2></div>${sit?'<span class="count">'+sitMessages(sit.id).length+'</span>':''}</div><div class="panelbody">${sit?editor(sit):help(stats)}${audit()}<p class="privacy">Die Chatdatei wird ausschließlich lokal gelesen. GitHub Pages erhält weder Nachrichtentexte noch eure Markierungen. Markierungen liegen im jeweiligen Browser und können als JSON zwischen Philipp und Lena ausgetauscht werden.</p></div></aside>
      </main>`;
    bindGlobal();bindWork();
  }

  function emptyView(){return `<header><div class="brand"><div class="logo">TW</div><div><div class="eyebrow">Eigenständige Prüf-PWA</div><h1>Situationsprüfung 2026</h1></div></div></header><main class="empty"><section class="panel"><div class="panelbody"><div><div class="eyebrow">Schritt 1</div><h2>Telegram-Chat lokal öffnen</h2></div><p class="muted">Die PWA übernimmt ausschließlich Einträge aus dem Kalenderjahr 2026. Weiterleitungen, reine Links, leere Medien, Sticker und Service-Ereignisse werden standardmäßig ausgeblendet.</p><label class="file primary" style="text-align:center">Chatdatei auswählen<input id="chat" type="file" accept=".json,application/json"></label><div class="notice">Keine Chatdatei wird hochgeladen. Philipp und Lena öffnen jeweils dieselbe Exportdatei lokal. Markierungen können über Export und Import ausgetauscht werden.</div><div class="chips"><span>Anfang und Ende markieren</span><span>Situationen nummerieren</span><span>Nachrichten umhängen</span><span>Training/Kontrolle trennen</span><span>JSON exportieren</span></div></div></section></main>`}
  function metric(a,b,c){return `<div class="metric"><span>${esc(a)}</span><strong>${esc(b)}</strong><small>${esc(c)}</small></div>`}
  function sitItem(s){const m=sitMessages(s.id),a=m[0],b=m[m.length-1];return `<button class="sit ${s.kind} ${state.selected===s.id?'active':''}" data-sit="${s.id}"><strong>Situation ${s.id}${s.label?' · '+esc(s.label):''}</strong><small>${m.length} Nachrichten · ${kindLabel(s.kind)} · ${statusLabel(s.status)}</small><span>${a?fmt(a.date)+' – '+fmt(b.date):'noch leer'}</span></button>`}
  function messageRows(rows){let day='';return rows.map(m=>{const d=dayKey(m.date),sep=d!==day?`<div class="day">${esc(dayLabel(m.date))}</div>`:'';day=d;return sep+message(m)}).join('')}
  function message(m){const sid=state.assign.get(m.id)||null,reply=m.reply?state.messages.find(x=>x.id===m.reply):null;const starts=state.situations.filter(s=>firstId(s.id)===m.id),ends=state.situations.filter(s=>lastId(s.id)===m.id);return `${starts.map(s=>`<div class="boundary start">Beginn Situation ${s.id}</div>`).join('')}<article class="message ${m.included?'':'excluded'} ${inRange(m.id)?'range':''} ${sid===state.selected?'selected':''}"><div><div class="meta"><strong>${esc(m.speaker)}</strong><span>${esc(fmt(m.date))}</span><span>ID ${esc(m.sourceId)}</span></div>${reply?`<div class="reply">↳ ${esc(reply.speaker)}: ${esc(short(reply.text||'['+(reply.media||'Medium')+']',150))}</div>`:''}<div class="text">${esc(m.text||'['+(m.media||'Leerer Eintrag')+']')}</div><div class="flags">${m.filter!=='keep'?`<span class="flag">${esc(m.filter)}</span>`:''}${m.media?`<span class="flag">${esc(m.media)}</span>`:''}${sid?`<span class="flag">Situation ${sid}</span>`:'<span class="flag">nicht zugeordnet</span>'}</div></div><div class="assignbox"><select class="assign" data-assign="${attr(m.id)}" ${m.included?'':'disabled'}><option value="">– nicht zugeordnet –</option>${state.situations.map(s=>`<option value="${s.id}" ${sid===s.id?'selected':''}>Situation ${s.id}${s.label?' · '+esc(s.label):''}</option>`).join('')}</select><div class="assignbuttons"><button class="small" data-start="${attr(m.id)}" ${m.included?'':'disabled'}>Anfang</button><button class="small" data-end="${attr(m.id)}" ${m.included?'':'disabled'}>Ende</button></div></div></article>${ends.map(s=>`<div class="boundary end">Ende Situation ${s.id}</div>`).join('')}`}
  function editor(s){const m=sitMessages(s.id);return `<div class="editorgrid"><label class="field">Bezeichnung<input id="label" value="${attr(s.label||'')}" placeholder="optional"></label><label class="field">Verwendung<select id="kind"><option value="training" ${s.kind==='training'?'selected':''}>Training</option><option value="control" ${s.kind==='control'?'selected':''}>Kontrollfall</option><option value="unclear" ${s.kind==='unclear'?'selected':''}>Nicht eindeutig</option></select></label><label class="field">Prüfstatus<select id="status"><option value="open" ${s.status==='open'?'selected':''}>Offen</option><option value="confirmed" ${s.status==='confirmed'?'selected':''}>Bestätigt</option><option value="corrected" ${s.status==='corrected'?'selected':''}>Korrigiert</option><option value="unclear" ${s.status==='unclear'?'selected':''}>Unklar</option></select></label><label class="field">Notiz<textarea id="note" rows="4">${esc(s.note||'')}</textarea></label><button id="saveMeta" class="primary">Speichern</button><div class="feature"><span>Nachrichten</span><strong>${m.length}</strong></div><div class="feature"><span>Dauer</span><strong>${duration(m)}</strong></div><button id="jump">Zur ersten Nachricht</button><button id="selectRange">Grenzen übernehmen</button><button id="clearSit" class="danger">Zuweisungen entfernen</button><button id="deleteSit" class="danger">Situation löschen</button></div>`}
  function help(st){return `<div class="notice">Bei einer Nachricht „Anfang“ und bei einer späteren Nachricht „Ende“ wählen. Danach den Bereich als neue Situation speichern. Einzelne Nachrichten lassen sich jederzeit über die Situationsauswahl umhängen.</div><div class="feature"><span>Abdeckung</span><strong>${st.coverage} %</strong></div>`}
  function audit(){return `<h3 style="margin-top:16px">Letzte Änderungen</h3>${state.events.slice(-6).reverse().map(e=>`<div class="feature"><span>${esc(e.text)}</span><small>${esc(fmt(e.at))}</small></div>`).join('')||'<p class="muted" style="margin-top:8px">Noch keine Änderung.</p>'}`}

  function bindGlobal(){document.getElementById('chat')?.addEventListener('change',loadChat);document.getElementById('ann')?.addEventListener('change',loadAnnotations);document.getElementById('exp')?.addEventListener('click',exportAnnotations);document.getElementById('train')?.addEventListener('click',exportTraining)}
  function bindWork(){
    document.getElementById('reviewer').onchange=e=>{state.reviewer=e.target.value;localStorage.setItem(STORE+'reviewer',state.reviewer)};
    document.getElementById('emptySit').onclick=()=>createSituation([]);document.getElementById('search').oninput=e=>{state.query=e.target.value;state.page=0;render()};document.getElementById('clear').onclick=()=>{state.query='';render()};document.getElementById('excluded').onchange=e=>{state.showExcluded=e.target.checked;state.page=0;render()};document.getElementById('prev').onclick=()=>{state.page--;render()};document.getElementById('next').onclick=()=>{state.page++;render()};document.getElementById('reset').onclick=()=>{state.start=state.end=null;render()};document.getElementById('make').onclick=createRange;
    document.querySelectorAll('[data-sit]').forEach(b=>b.onclick=()=>{state.selected=Number(b.dataset.sit);render()});document.querySelectorAll('[data-start]').forEach(b=>b.onclick=()=>{state.start=b.dataset.start;if(state.end&&idx(state.end)<idx(state.start))state.end=null;render()});document.querySelectorAll('[data-end]').forEach(b=>b.onclick=()=>{state.end=b.dataset.end;if(state.start&&idx(state.end)<idx(state.start))state.start=null;render()});document.querySelectorAll('[data-assign]').forEach(s=>s.onchange=()=>assignOne(s.dataset.assign,s.value?Number(s.value):null));
    if(getSelected()){document.getElementById('saveMeta').onclick=saveMeta;document.getElementById('jump').onclick=jump;document.getElementById('selectRange').onclick=()=>{const s=getSelected();state.start=firstId(s.id);state.end=lastId(s.id);render()};document.getElementById('clearSit').onclick=clearSit;document.getElementById('deleteSit').onclick=deleteSit}
  }

  async function loadChat(e){const f=e.target.files?.[0];if(!f)return;try{const raw=await f.text(),hash=await sha(raw),p=JSON.parse(raw);if(!Array.isArray(p.messages))throw Error('Keine Telegram-Nachrichtenliste gefunden.');const normalized=p.messages.map(normalize).filter(m=>yearOf(m.date)===YEAR).sort((a,b)=>a.unix-b.unix);state.dataset={hash,label:(p.name||f.name)+' · 2026',total:p.messages.length,selected:normalized.length};state.messages=normalized;state.situations=[];state.assign=new Map();state.events=[];state.page=0;state.query='';state.start=state.end=state.selected=null;restore();render()}catch(err){alert('Chat konnte nicht geladen werden: '+(err.message||err))}finally{e.target.value=''}}
  function normalize(m,i){const text=flat(m?.text);const media=m?.media_type||(m?.photo?'photo':m?.file?'file':null);const forwarded=!!(m?.forwarded_from||m?.forwarded_from_id);let included=true,filter='keep';if(!m||m.type!=='message'){included=false;filter='service_event'}else if(forwarded){included=false;filter='forwarded'}else if(media==='sticker'){included=false;filter='sticker'}else if(!text.trim()&&media){included=false;filter='media_without_text'}else if(!text.trim()){included=false;filter='empty'}else if(/^\s*(?:https?:\/\/|www\.)\S+\s*$/iu.test(text)){included=false;filter='pure_link'}const date=String(m?.date||m?.date_unixtime||'');return{id:String(m?.id??'m-'+i),sourceId:String(m?.id??'m-'+i),date,unix:timeNum(m?.date_unixtime||m?.date,i),speaker:String(m?.from||m?.actor||'System'),speakerId:String(m?.from_id||m?.actor_id||'unknown'),text,reply:m?.reply_to_message_id==null?null:String(m.reply_to_message_id),media:media?String(media):null,included,filter}}
  function flat(v){if(typeof v==='string')return v;if(!Array.isArray(v))return'';return v.map(x=>typeof x==='string'?x:(x&&typeof x.text==='string'?x.text:'')).join('')}
  function createRange(){if(!canRange())return;const ids=state.messages.slice(idx(state.start),idx(state.end)+1).filter(m=>m.included).map(m=>m.id);createSituation(ids);state.start=state.end=null}
  function createSituation(ids){const id=state.situations.reduce((m,s)=>Math.max(m,s.id),0)+1;state.situations.push({id,label:'',note:'',kind:id%5===0?'control':'training',status:'open',createdAt:new Date().toISOString()});ids.forEach(x=>state.assign.set(x,id));state.selected=id;event('Situation '+id+' erstellt');persist();render()}
  function assignOne(id,sid){if(sid==null)state.assign.delete(id);else state.assign.set(id,sid);event('Nachricht '+id+' neu zugeordnet');persist();render()}
  function saveMeta(){const s=getSelected();s.label=document.getElementById('label').value.trim();s.kind=document.getElementById('kind').value;s.status=document.getElementById('status').value;s.note=document.getElementById('note').value.trim();event('Situation '+s.id+' gespeichert');persist();render()}
  function clearSit(){const s=getSelected();if(!confirm('Alle Zuweisungen aus Situation '+s.id+' entfernen?'))return;for(const[k,v]of state.assign)if(v===s.id)state.assign.delete(k);event('Situation '+s.id+' geleert');persist();render()}
  function deleteSit(){const s=getSelected();if(!confirm('Situation '+s.id+' löschen?'))return;for(const[k,v]of state.assign)if(v===s.id)state.assign.delete(k);state.situations=state.situations.filter(x=>x.id!==s.id);event('Situation '+s.id+' gelöscht');state.selected=null;persist();render()}
  function jump(){const s=getSelected(),id=firstId(s.id);if(!id)return;state.query='';state.showExcluded=false;const v=getVisible(),n=v.findIndex(m=>m.id===id);state.page=Math.max(0,Math.floor(n/PAGE_SIZE));render();setTimeout(()=>document.querySelector('[data-assign="'+CSS.escape(id)+'"]')?.closest('.message')?.scrollIntoView({behavior:'smooth',block:'center'}),50)}

  function persist(){if(!state.dataset)return;localStorage.setItem(STORE+state.dataset.hash,JSON.stringify(payload(false)))}
  function restore(){try{const x=localStorage.getItem(STORE+state.dataset.hash);if(x)apply(JSON.parse(x),false)}catch{}}
  async function loadAnnotations(e){const f=e.target.files?.[0];if(!f||!state.dataset)return;try{apply(JSON.parse(await f.text()),true);persist();render()}catch(err){alert('Markierungen konnten nicht geladen werden: '+(err.message||err))}finally{e.target.value=''}}
  function apply(p,match){if(p?.schemaVersion!=='truewords-manual-segmentation/v2')throw Error('Unbekanntes Markierungsformat.');if(match&&p.datasetHash!==state.dataset.hash)throw Error('Die Markierungen gehören zu einer anderen Chatdatei.');const ids=new Set(state.messages.map(m=>m.id));state.situations=(p.situations||[]).map(s=>({id:Number(s.id),label:String(s.label||''),note:String(s.note||''),kind:['training','control','unclear'].includes(s.kind)?s.kind:'training',status:['open','confirmed','corrected','unclear'].includes(s.status)?s.status:'open',createdAt:String(s.createdAt||new Date().toISOString())})).filter(s=>s.id>0);const valid=new Set(state.situations.map(s=>s.id));state.assign=new Map(Object.entries(p.assignments||{}).filter(([id,s])=>ids.has(id)&&valid.has(Number(s))).map(([id,s])=>[id,Number(s)]));state.events=Array.isArray(p.events)?p.events.slice(-2000):[]}
  function payload(exported){return{schemaVersion:'truewords-manual-segmentation/v2',datasetHash:state.dataset.hash,datasetLabel:state.dataset.label,reviewer:state.reviewer,exportedAt:exported?new Date().toISOString():undefined,situations:state.situations,assignments:Object.fromEntries(state.assign),events:state.events}}
  function exportAnnotations(){download(safe(state.dataset.label)+'-'+state.reviewer+'-markierungen.json',payload(true))}
  function exportTraining(){const inc=state.messages.filter(m=>m.included);const rows=inc.map((m,i)=>{const prev=inc[i-1]||null,sid=state.assign.get(m.id)||null,ps=prev?(state.assign.get(prev.id)||null):null,s=state.situations.find(x=>x.id===sid)||null;return{messageId:m.id,sourceId:m.sourceId,situationId:sid,split:s?.kind||null,status:s?.status||null,boundaryBefore:!!(sid&&sid!==ps),timestamp:m.date,gapBeforeSeconds:prev?Math.max(0,m.unix-prev.unix):null,speakerChanged:prev?m.speakerId!==prev.speakerId:null,replyToMessageId:m.reply,replyToSameSituation:m.reply?state.assign.get(m.reply)===sid:null,textLength:m.text.length,wordCount:m.text.trim()?m.text.trim().split(/\s+/u).length:0,shortResponse:m.text.trim().length<=12,emojiOnly:m.text.trim()&&!/[\p{L}\p{N}]/u.test(m.text),hasQuestion:/[?？]/u.test(m.text),hasMedia:!!m.media,mediaType:m.media}});download(safe(state.dataset.label)+'-segmentierungsdaten.json',{schemaVersion:'truewords-segmentation-training/v2',datasetHash:state.dataset.hash,reviewer:state.reviewer,exportedAt:new Date().toISOString(),situations:state.situations.map(s=>({...s,messageIds:sitMessages(s.id).map(m=>m.id)})),rows})}
  function download(name,obj){const u=URL.createObjectURL(new Blob([JSON.stringify(obj,null,2)],{type:'application/json'})),a=document.createElement('a');a.href=u;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(u),500)}

  function getVisible(){const q=state.query.trim().toLocaleLowerCase('de');return state.messages.filter(m=>(state.showExcluded||m.included)&&(!q||m.text.toLocaleLowerCase('de').includes(q)||m.sourceId.toLocaleLowerCase('de').includes(q)))}
  function getStats(){const included=state.messages.filter(m=>m.included).length,assigned=state.messages.filter(m=>m.included&&state.assign.has(m.id)).length;return{included,assigned,unassigned:included-assigned,coverage:included?Math.round(assigned/included*100):0,training:state.situations.filter(s=>s.kind==='training').length,control:state.situations.filter(s=>s.kind==='control').length}}
  function sitMessages(id){return state.messages.filter(m=>state.assign.get(m.id)===id)}function getSelected(){return state.situations.find(s=>s.id===state.selected)||null}function firstId(id){return sitMessages(id)[0]?.id||null}function lastId(id){const x=sitMessages(id);return x[x.length-1]?.id||null}function idx(id){return state.messages.findIndex(m=>m.id===id)}function canRange(){return!!(state.start&&state.end&&idx(state.start)<=idx(state.end))}function inRange(id){return canRange()&&idx(id)>=idx(state.start)&&idx(id)<=idx(state.end)}
  function rangeText(){if(!state.start&&!state.end)return'Noch keinen Bereich gewählt.';if(state.start&&!state.end)return'Anfang '+state.start+' gesetzt – jetzt Ende wählen.';if(!state.start&&state.end)return'Ende '+state.end+' gesetzt – jetzt Anfang wählen.';return'Bereich '+state.start+' bis '+state.end}
  function event(text){state.events.push({at:new Date().toISOString(),reviewer:state.reviewer,text});if(state.events.length>2000)state.events.shift()}
  function duration(m){if(m.length<2)return'0 Min.';const s=Math.max(0,m[m.length-1].unix-m[0].unix);return s<3600?Math.round(s/60)+' Min.':s<86400?(s/3600).toFixed(1)+' Std.':(s/86400).toFixed(1)+' Tage'}
  function yearOf(v){const d=new Date(/^\d{9,13}$/.test(String(v))?(String(v).length>10?Number(v):Number(v)*1000):v);return Number.isNaN(d.getTime())?null:d.getUTCFullYear()}function timeNum(v,f){if(/^\d{9,13}$/.test(String(v)))return String(v).length>10?Math.floor(Number(v)/1000):Number(v);const n=new Date(v).getTime();return Number.isFinite(n)?Math.floor(n/1000):f}
  async function sha(s){const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s));return[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}
  function fmt(v){const d=new Date(v);return Number.isNaN(d.getTime())?String(v):new Intl.DateTimeFormat('de-DE',{dateStyle:'short',timeStyle:'short'}).format(d)}function dayKey(v){const d=new Date(v);return Number.isNaN(d.getTime())?String(v):d.toISOString().slice(0,10)}function dayLabel(v){const d=new Date(v);return Number.isNaN(d.getTime())?String(v):new Intl.DateTimeFormat('de-DE',{dateStyle:'full'}).format(d)}function kindLabel(v){return v==='control'?'Kontrollfall':v==='unclear'?'Nicht eindeutig':'Training'}function statusLabel(v){return v==='confirmed'?'bestätigt':v==='corrected'?'korrigiert':v==='unclear'?'unklar':'offen'}function short(s,n){return s.length>n?s.slice(0,n-1)+'…':s}function safe(s){return String(s).replace(/[^a-z0-9._-]+/giu,'-').replace(/^-+|-+$/g,'')||'truewords'}function esc(s){return String(s??'').replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;').replaceAll("'",'&#039;')}function attr(s){return esc(s).replaceAll('`','&#096;')}
  render();
})();
