<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0b1220">
  <meta name="robots" content="noindex,nofollow">
  <title>TrueWords · Anmeldung</title>
  <link rel="stylesheet" href="./portal.css">
</head>
<body>
  <main class="page">
    <section class="login-shell card">
      <div class="eyebrow">Private Prüfung</div>
      <h1>TrueWords öffnen</h1>
      <p class="intro">Mit E-Mail-Adresse und Passwort anmelden.</p>

      <form id="login-form">
        <label>
          <span>E-Mail-Adresse</span>
          <input id="email" type="email" autocomplete="username" inputmode="email" required>
        </label>
        <label>
          <span>Passwort</span>
          <input id="password" type="password" autocomplete="current-password" required>
        </label>
        <button id="submit" class="primary" type="submit">Anmelden</button>
      </form>

      <div id="status" class="status" role="status" aria-live="polite">Noch nicht angemeldet.</div>
      <div id="setup-note" class="notice" hidden>
        Die beiden Konten sind noch nicht eingerichtet. <a class="link" href="./account-setup.html">Einmalige Einrichtung öffnen</a>
      </div>
    </section>
  </main>
  <script src="./login.js"></script>
</body>
</html>
