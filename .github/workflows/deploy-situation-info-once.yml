name: Deploy situation info once

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/deploy-situation-info-once.yml'

permissions:
  contents: read

concurrency:
  group: truewords-situation-info-once
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-24.04
    environment: review-server
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"

      - name: Validate current review build
        run: |
          npm install
          npm run check
          npm run build
          test -f dist/situation-info.html
          test -f dist/situation-info.css
          test -f dist/situation-info.js
          grep -q 'situation-info.html' dist/login.js
          grep -q 'Situation = zusammenhängende Gesprächsepisode' dist/situation-info.html
          grep -q 'TrueWords-Segmentierungsalgorithmus V3' dist/situation-info.html
          grep -q "source: 'truewords-segmentation-v3-unseen'" dist/upload.js
          grep -q "externalLlmBoundaryGeneration: false" dist/upload.js

      - name: Deploy Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy

      - name: Verify live routes
        run: |
          base='https://truewords-review-sync.truewords-review-896be42e.workers.dev'
          sleep 20
          curl --fail --silent --show-error --retry 18 --retry-delay 5 --retry-all-errors "$base/api/health" > health.json
          grep -q 'ok' health.json
          curl --silent --show-error -D info-headers.txt -o /dev/null "$base/situation-info.html"
          grep -Eq '^HTTP/.* 302' info-headers.txt
          grep -Eqi '^location: /login.html' info-headers.txt
          curl --silent --show-error -D review-headers.txt -o /dev/null "$base/review.html"
          grep -Eq '^HTTP/.* 302' review-headers.txt
          grep -Eqi '^location: /login.html' review-headers.txt
