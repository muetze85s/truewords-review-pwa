name: Deploy account timezone and TrueWords theme v10 once

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: truewords-review-server
  cancel-in-progress: false

jobs:
  deploy:
    if: github.head_ref == 'agent/server-synchronization'
    runs-on: ubuntu-latest
    environment: review-server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install and validate
        run: |
          npm install
          npm run check
          npm run build
          test -f dist/truewords-theme.css
          grep -q 'Asia/Bangkok' dist/review.js
          grep -q 'Europe/Berlin' dist/review.js
          test "$(grep -c 'function accountTimeZone' dist/review.js)" = "1"
          grep -q 'truewords-theme.css?v=10' dist/review.html
          grep -q 'portal-brand' dist/login.html
          grep -q 'portal-brand' dist/upload.html
          grep -q 'truewords-review-pwa-server-v9' dist/sw.js

      - name: Deploy Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy

      - name: Verify live endpoints
        run: |
          base=https://truewords-review-sync.truewords-review-896be42e.workers.dev
          sleep 20
          curl --fail --silent --show-error --retry 24 --retry-delay 5 --retry-all-errors "$base/api/health"
          code=$(curl --silent --output /dev/null --write-out '%{http_code}' "$base/review.html")
          test "$code" = "302"
          code=$(curl --silent --output /tmp/login.html --write-out '%{http_code}' "$base/login.html")
          test "$code" = "200"
          grep -q 'portal-brand' /tmp/login.html
