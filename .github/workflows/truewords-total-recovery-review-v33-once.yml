name: TrueWords total recovery review v33 once

on:
  push:
    branches:
      - agent/server-synchronization
    paths:
      - '.github/workflows/truewords-total-recovery-review-v33-once.yml'

permissions:
  contents: read
  statuses: write

jobs:
  snapshot:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build exact review v33 snapshot
        shell: bash
        env:
          SOURCE_SHA: f27842aece76f2e8dda2617a602a33a0ea575afe
        run: |
          set -euo pipefail
          mkdir -p recovery
          git cat-file -e "${SOURCE_SHA}^{commit}"
          git archive --format=tar.gz --output=recovery/truewords-review-v33-source.tar.gz "$SOURCE_SHA"
          git ls-tree -r --name-only "$SOURCE_SHA" > recovery/TRACKED_FILES.txt
          python3 - <<'PY'
          import hashlib, subprocess
          from pathlib import Path
          sha = 'f27842aece76f2e8dda2617a602a33a0ea575afe'
          files = subprocess.check_output(['git','ls-tree','-r','--name-only',sha], text=True).splitlines()
          lines=[]
          for path in files:
              data=subprocess.check_output(['git','show',f'{sha}:{path}'])
              lines.append(f"{hashlib.sha256(data).hexdigest()}  {path}")
          Path('recovery/SHA256SUMS.txt').write_text('\n'.join(lines)+'\n', encoding='utf-8')
          PY
          count=$(wc -l < recovery/TRACKED_FILES.txt | tr -d ' ')
          cat > recovery/METADATA.txt <<EOF
          TrueWords review application disaster recovery snapshot
          Product: TrueWords Review PWA / Prüfstand
          UI generation: v33
          Exact Git commit: ${SOURCE_SHA}
          Tracked file count: ${count}
          Secrets included: NO
          Live D1 row data included: NO
          Telegram original export included: NO
          EOF
          sha256sum recovery/truewords-review-v33-source.tar.gz > recovery/ARCHIVE_SHA256.txt

      - name: Upload snapshot
        uses: actions/upload-artifact@v4
        with:
          name: truewords-review-v33-total-recovery
          path: recovery
          if-no-files-found: error
          retention-days: 7

      - name: Publish snapshot status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          state=success
          if [ "${{ job.status }}" != "success" ]; then state=failure; fi
          curl --fail --silent --show-error -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -d "{\"state\":\"${state}\",\"context\":\"truewords/recovery-review-v33\",\"description\":\"Exact review v33 recovery snapshot ${state}\",\"target_url\":\"https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}\"}" >/dev/null
