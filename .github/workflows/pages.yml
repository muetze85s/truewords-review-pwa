name: Validate and deploy Review PWA

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate files
        run: |
          test -f index.html
          test -f manifest.webmanifest
          test -f icon.svg
          test -f sw.js
          python -m json.tool manifest.webmanifest >/dev/null
          node --check sw.js
          awk '/<script>/{flag=1;next}/<\/script>/{flag=0}flag' index.html > /tmp/review-app.js
          node --check /tmp/review-app.js
          ! grep -R "Philena_chat" . --exclude-dir=.git

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: .

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
