name: Validate and deploy Review PWA

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate source files
        run: |
          test -f index.html
          test -f manifest.webmanifest
          test -f icon.svg
          test -f sw.js
          test -f enhancements.css
          test -f enhancements.js
          python -m json.tool manifest.webmanifest >/dev/null
          node --check sw.js
          node --check enhancements.js
          awk '/<script>/{flag=1;next}/<\/script>/{flag=0}flag' index.html > /tmp/review-app.js
          node --check /tmp/review-app.js
          ! grep -H "Philena_chat" index.html manifest.webmanifest icon.svg sw.js enhancements.css enhancements.js README.md

      - name: Prepare public site
        run: |
          rm -rf site
          mkdir site
          cp index.html manifest.webmanifest icon.svg sw.js enhancements.css enhancements.js .nojekyll site/
          python - <<'PY'
          from pathlib import Path
          path = Path('site/index.html')
          html = path.read_text(encoding='utf-8')
          html = html.replace('</head>', '  <link rel="stylesheet" href="./enhancements.css">\n</head>', 1)
          html = html.replace('</body>', '  <script src="./enhancements.js"></script>\n</body>', 1)
          path.write_text(html, encoding='utf-8')
          PY
          grep -q 'enhancements.css' site/index.html
          grep -q 'enhancements.js' site/index.html
          ! grep -R "Philena_chat" site

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
