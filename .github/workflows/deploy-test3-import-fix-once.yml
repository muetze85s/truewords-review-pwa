name: Deploy Test 3 import fix once

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/deploy-test3-import-fix-once.yml

permissions:
  contents: read

concurrency:
  group: truewords-review-server
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: review-server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          PHILIPP_REVIEW_TOKEN: ${{ secrets.PHILIPP_REVIEW_TOKEN }}
          LENA_REVIEW_TOKEN: ${{ secrets.LENA_REVIEW_TOKEN }}
          ADMIN_REVIEW_TOKEN: ${{ secrets.ADMIN_REVIEW_TOKEN }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          test -n "$PHILIPP_REVIEW_TOKEN"
          test -n "$LENA_REVIEW_TOKEN"
          test -n "$ADMIN_REVIEW_TOKEN"

      - name: Validate and build
        run: |
          npm install
          npm run check
          npm run build
          grep -q 'PILOT_V3_STORAGE_SHA256' src/worker-chunked.ts
          grep -q 'a503edc19adaf2a2c659c18e851a4852a0de88ce4c1ffc948a52f6a295c0a8ee' src/worker-chunked.ts

      - name: Deploy Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy

      - name: Configure access tokens
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          PHILIPP_REVIEW_TOKEN: ${{ secrets.PHILIPP_REVIEW_TOKEN }}
          LENA_REVIEW_TOKEN: ${{ secrets.LENA_REVIEW_TOKEN }}
          ADMIN_REVIEW_TOKEN: ${{ secrets.ADMIN_REVIEW_TOKEN }}
        run: |
          printf '%s' "$PHILIPP_REVIEW_TOKEN" | npx wrangler secret put PHILIPP_REVIEW_TOKEN
          printf '%s' "$LENA_REVIEW_TOKEN" | npx wrangler secret put LENA_REVIEW_TOKEN
          printf '%s' "$ADMIN_REVIEW_TOKEN" | npx wrangler secret put ADMIN_REVIEW_TOKEN

      - name: Migrate and verify health
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx wrangler d1 migrations apply truewords-review-sync-db --remote
          sleep 20
          curl --fail --silent --show-error --retry 20 --retry-delay 5 --retry-all-errors \
            "https://truewords-review-sync.truewords-review-896be42e.workers.dev/api/health"
