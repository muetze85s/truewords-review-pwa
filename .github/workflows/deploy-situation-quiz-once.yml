name: Deploy Lena situation quiz once

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/deploy-situation-quiz-once.yml'

permissions:
  contents: read

concurrency:
  group: truewords-review-situation-quiz-once
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: review-server
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"

      - name: Validate and build
        run: |
          npm install
          npm run check
          npm run build
          test -f dist/situation-quiz.html
          test -f dist/situation-quiz.css
          test -f dist/situation-quiz.js
          grep -q 'worker-situation-quiz.ts' wrangler.jsonc

      - name: Apply D1 migrations
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler d1 migrations apply truewords-review-sync-db --remote

      - name: Verify quiz table
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx wrangler d1 execute truewords-review-sync-db --remote --json --command "SELECT name FROM sqlite_master WHERE type='table' AND name='review_situation_quiz_results';" > quiz-table.json
          grep -q 'review_situation_quiz_results' quiz-table.json

      - name: Deploy Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy

      - name: Verify live routing
        run: |
          sleep 20
          curl --fail --silent --show-error --retry 18 --retry-delay 5 --retry-all-errors \
            'https://truewords-review-sync.truewords-review-896be42e.workers.dev/api/health'
          curl --silent --show-error -D quiz-headers.txt -o /dev/null \
            'https://truewords-review-sync.truewords-review-896be42e.workers.dev/situation-quiz.html'
          grep -Eq '^HTTP/.* 302' quiz-headers.txt
          grep -Eqi '^location: /login.html' quiz-headers.txt
