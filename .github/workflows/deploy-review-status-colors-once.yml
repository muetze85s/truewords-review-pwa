name: Deploy review status colors once

on:
  push:
    branches:
      - agent/server-synchronization
    paths:
      - review-status-colors.css

permissions:
  contents: read

concurrency:
  group: truewords-review-server
  cancel-in-progress: false

jobs:
  validate-and-deploy:
    runs-on: ubuntu-latest
    environment: review-server
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install
        run: npm install

      - name: Validate source
        run: |
          npm run check
          npm run build
          test -f dist/review-status-colors.css
          grep -q 'review-status-colors.css' dist/review.html
          grep -q 'status-corrected' dist/review-status-colors.css
          grep -q 'background: var(--corrected)' dist/review-status-colors.css

      - name: Deploy Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy

      - name: Verify health
        run: |
          sleep 20
          curl --fail --silent --show-error \
            --retry 24 --retry-delay 5 --retry-all-errors \
            --connect-timeout 10 --max-time 20 \
            'https://truewords-review-sync.truewords-review-896be42e.workers.dev/api/health'
