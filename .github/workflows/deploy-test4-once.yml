name: Deploy Test 4 once

on:
  push:
    branches:
      - agent/server-synchronization
    paths:
      - '.github/workflows/deploy-test4-once.yml'
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/deploy-test4-once.yml'

permissions:
  contents: read

concurrency:
  group: truewords-test4-once
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-24.04
    environment: review-server
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"

      - name: Validate current review build
        run: |
          npm install
          npm run check
          npm run build
          test -f dist/login.html
          test -f dist/upload.html
          test -f dist/situation-info.html
          test -f dist/segmentation-v4.mjs
          grep -q 'Situation = Konversation' dist/situation-info.html
          grep -q 'Vier Stunden Antwortpause können eine Situation bleiben' dist/situation-info.html
          grep -q 'V4 auf einem neuen ungesehenen Abschnitt prüfen' dist/upload.html
          grep -q 'createTest4Preselection' dist/upload.js
          grep -q 'timeGapAloneCreatesBoundary' dist/segmentation-v4.mjs
          grep -q 'worker-source-integrity-v4.ts' wrangler.jsonc
          grep -q 'philena-2026-pilot-v4-unseen' wrangler.jsonc

      - name: Deploy Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy

      - name: Verify live routes
        run: |
          base='https://truewords-review-sync.truewords-review-896be42e.workers.dev'
          sleep 20
          curl --fail --silent --show-error --retry 18 --retry-delay 5 --retry-all-errors "$base/api/health" > health.json
          grep -q 'ok' health.json
          curl --fail --silent --show-error "$base/login.html" > login.html
          grep -q 'Konversationen sauber voneinander trennen' login.html
          curl --silent --show-error -D info-headers.txt -o /dev/null "$base/situation-info.html"
          grep -Eq '^HTTP/.* 302' info-headers.txt
          grep -Eqi '^location: /login.html' info-headers.txt
          curl --silent --show-error -D review-headers.txt -o /dev/null "$base/review.html"
          grep -Eq '^HTTP/.* 302' review-headers.txt
          grep -Eqi '^location: /login.html' review-headers.txt
          curl --silent --show-error -D upload-headers.txt -o /dev/null "$base/upload.html"
          grep -Eq '^HTTP/.* 302' upload-headers.txt
          grep -Eqi '^location: /login.html' upload-headers.txt
