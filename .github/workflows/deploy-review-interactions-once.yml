name: Deploy review interactions once

on:
  push:
    branches:
      - agent/server-synchronization
    paths:
      - '.github/workflows/deploy-review-interactions-once.yml'

permissions:
  contents: read

concurrency:
  group: truewords-review-interactions-once
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-24.04
    environment: review-server
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"

      - name: Validate current review build
        run: |
          npm install
          npm run check
          npm run build
          test -f dist/review-navigation-fix.js
          grep -q 'review-navigation-fix.js?v=2' dist/review.html
          grep -q '242,108,131' dist/review.html
          grep -q 'truewords/review-after-upload' dist/situation-info.html
          grep -q 'server-v25' dist/sw.js

      - name: Deploy Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy

      - name: Verify live routes
        run: |
          base='https://truewords-review-sync.truewords-review-896be42e.workers.dev'
          sleep 20
          curl --fail --silent --show-error --retry 18 --retry-delay 5 --retry-all-errors "$base/api/health" > health.json
          grep -q 'ok' health.json
          curl --fail --silent --show-error "$base/login.html" | grep -q 'truewords-user-theme.js'
          curl --silent --show-error -D review-headers.txt -o /dev/null "$base/review.html"
          grep -Eq '^HTTP/.* 302' review-headers.txt
          grep -Eqi '^location: /login.html' review-headers.txt
