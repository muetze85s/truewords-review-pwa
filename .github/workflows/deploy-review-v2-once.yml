name: Deploy completed Review V2 once

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/deploy-review-v2-once.yml'

permissions:
  contents: read

concurrency:
  group: truewords-review-v2-once
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-24.04
    environment: review-server
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"

      - name: Validate and build Review V2
        run: |
          npm install
          npm run check
          npm run build
          test -f dist/review.html
          test -f dist/review-v2-app.css
          test -f dist/review-v2-app.js
          test -f dist/review-v2-events.js
          grep -q 'review-v2-app.js' dist/review.html
          grep -q 'review-v2-events.js' dist/review.html
          grep -q 'Neue Situation ab hier' dist/review-v2-app.js
          grep -q '#F3F4F6' dist/review-v2-app.css
          grep -q '#121214' dist/review-v2-app.css
          ! grep -q 'backdrop-filter' dist/review-v2-app.css

      - name: Deploy Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy

      - name: Verify live health and secured review route
        run: |
          sleep 20
          curl --fail --silent --show-error --retry 18 --retry-delay 5 --retry-all-errors \
            'https://truewords-review-sync.truewords-review-896be42e.workers.dev/api/health' > health.json
          grep -q 'ok' health.json
          curl --silent --show-error -D review-headers.txt -o /dev/null \
            'https://truewords-review-sync.truewords-review-896be42e.workers.dev/review.html'
          grep -Eq '^HTTP/.* 302' review-headers.txt
          grep -Eqi '^location: /login.html' review-headers.txt
