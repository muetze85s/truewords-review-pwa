name: Deploy review v33 fixed sync once

on:
  push:
    branches:
      - agent/server-synchronization
    paths:
      - '.github/workflows/deploy-review-v33-fixed-sync-once.yml'

permissions:
  contents: read
  statuses: write

concurrency:
  group: truewords-review-v33-fixed-sync-once
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-24.04
    environment: review-server
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Mark v33 build pending
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl --fail --silent --show-error -X POST \
            -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -d '{"state":"pending","context":"truewords/v33-build","description":"v33 build running"}' >/dev/null

      - name: Validate and build v33
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          npm install
          npm run check
          npm run build
          npx wrangler deploy --dry-run
          test -f dist/review-v31.css
          test -f dist/review-v31-ui.js
          grep -q 'review-v31.css?v=3' dist/review.html
          grep -q 'review-v31-ui.js?v=3' dist/review.html
          grep -q 'truewords-review-pwa-server-v33' dist/sw.js
          grep -q 'tw-v33-fixed-list' dist/review-v31.css
          grep -q 'tw-v33-mobile-strip' dist/review-v31.css
          grep -q 'beginSync' dist/review-v31-ui.js
          grep -q 'syncGuard' dist/review-v31-ui.js
          grep -q 'alignBoundary' dist/review-v31-ui.js
          grep -q 'data-boundary-start' dist/review-v31-ui.js

      - name: Mark build success and deploy pending
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl --fail --silent --show-error -X POST \
            -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -d '{"state":"success","context":"truewords/v33-build","description":"v33 build passed"}' >/dev/null
          curl --fail --silent --show-error -X POST \
            -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -d '{"state":"pending","context":"truewords/v33-deploy","description":"v33 deployment running"}' >/dev/null

      - name: Deploy Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy

      - name: Mark deploy success and live verification pending
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl --fail --silent --show-error -X POST \
            -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -d '{"state":"success","context":"truewords/v33-deploy","description":"v33 deployed"}' >/dev/null
          curl --fail --silent --show-error -X POST \
            -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -d '{"state":"pending","context":"truewords/v33-live","description":"v33 live verification running"}' >/dev/null

      - name: Verify live v33
        run: |
          base='https://truewords-review-sync.truewords-review-896be42e.workers.dev'
          sleep 20
          curl --fail --silent --show-error --retry 18 --retry-delay 5 --retry-all-errors "$base/api/health" -o health.json
          grep -q 'ok' health.json
          curl --fail --silent --show-error "$base/sw.js" -o live-sw.js
          curl --fail --silent --show-error "$base/review.html" -o /dev/null -D review-headers.txt || true
          curl --fail --silent --show-error "$base/review-v31.css?v=3" -o live-v31.css
          curl --fail --silent --show-error "$base/review-v31-ui.js?v=3" -o live-v31-ui.js
          grep -q 'truewords-review-pwa-server-v33' live-sw.js
          grep -q 'tw-v33-fixed-list' live-v31.css
          grep -q 'tw-v33-mobile-strip' live-v31.css
          grep -q 'syncGuard' live-v31-ui.js
          grep -q 'alignBoundary' live-v31-ui.js
          grep -Eq '^HTTP/.* 302' review-headers.txt
          grep -Eqi '^location: /login.html' review-headers.txt

      - name: Mark live success
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl --fail --silent --show-error -X POST \
            -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -d '{"state":"success","context":"truewords/v33-live","description":"v33 live verification passed"}' >/dev/null

      - name: Mark workflow failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl --silent --show-error -X POST \
            -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -d '{"state":"failure","context":"truewords/v33-workflow","description":"v33 deployment workflow failed"}' >/dev/null || true
