name: Deploy review v29 once

on:
  push:
    branches:
      - agent/server-synchronization
    paths:
      - '.github/workflows/deploy-review-v29-once.yml'

permissions:
  contents: write

concurrency:
  group: truewords-review-v29-once
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-24.04
    environment: review-server
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"

      - name: Validate current review build
        run: |
          npm install
          npm run check
          npm run build
          test -f dist/review-redesign-v29.css
          test -f dist/review-experience-v29.js
          test -f dist/review-navigation-fix.js
          grep -q 'review-navigation-fix.js?v=5' dist/review.html
          grep -q 'review-redesign-v29.css?v=1' dist/review.html
          grep -q 'review-experience-v29.js?v=1' dist/review.html
          grep -q 'truewords-review-pwa-server-v29' dist/sw.js

      - name: Deploy Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy

      - name: Verify live routes and assets
        run: |
          base='https://truewords-review-sync.truewords-review-896be42e.workers.dev'
          sleep 20
          curl --fail --silent --show-error --retry 18 --retry-delay 5 --retry-all-errors "$base/api/health" > health.json
          grep -q 'ok' health.json
          curl --fail --silent --show-error "$base/sw.js" | grep -q 'truewords-review-pwa-server-v29'
          curl --fail --silent --show-error "$base/review-redesign-v29.css" | grep -q '.tw-mobile-list-fab'
          curl --fail --silent --show-error "$base/review-experience-v29.js" | grep -q 'moveConfirmationIntoEndLine'
          curl --silent --show-error -D review-headers.txt -o /dev/null "$base/review.html"
          grep -Eq '^HTTP/.* 302' review-headers.txt
          grep -Eqi '^location: /login.html' review-headers.txt

      - name: Record successful deployment
        run: |
          printf 'review-v29-live\n' > .github/review-v29-deploy-success
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/review-v29-deploy-success
          git commit -m 'Record successful review v29 deployment'
          git push
