name: Deploy review v30 verified once

on:
  push:
    branches:
      - agent/server-synchronization
    paths:
      - '.github/workflows/deploy-review-v30-verified-once.yml'

permissions:
  contents: read
  statuses: write

concurrency:
  group: truewords-review-v30-verified-once
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-24.04
    environment: review-server
    timeout-minutes: 20
    steps:
      - name: Mark deployment pending
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl --fail --silent --show-error -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -d '{"state":"pending","context":"truewords/review-v30-deploy","description":"Review v30 deployment running"}' >/dev/null

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate credentials and Wrangler
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          npm install
          npx wrangler --version

      - name: Validate final v30 build
        run: |
          npm run check
          npm run build
          npx wrangler deploy --dry-run
          test -f dist/review-v30.css
          test -f dist/review-v30-app.js
          test -f dist/vendor/embla-carousel.umd.js
          grep -q 'review-v30.css?v=1' dist/review.html
          grep -q 'vendor/embla-carousel.umd.js?v=8.6.0' dist/review.html
          grep -q 'review-v30-app.js?v=1' dist/review.html
          ! grep -q 'review-navigation-fix.js' dist/review.html
          ! grep -q 'review-experience-v29.js' dist/review.html
          grep -q 'truewords-review-pwa-server-v30' dist/sw.js
          grep -q 'EmblaCarousel' dist/review-v30-app.js
          grep -q 'showModal' dist/review-v30-app.js
          grep -q 'activeFromChatPosition' dist/review-v30-app.js

      - name: Mark build verified
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl --fail --silent --show-error -X POST \
            -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -d '{"state":"success","context":"truewords/review-v30-build","description":"Review v30 build verified"}' >/dev/null

      - name: Deploy Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy

      - name: Mark Worker deployed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl --fail --silent --show-error -X POST \
            -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -d '{"state":"success","context":"truewords/review-v30-worker","description":"Cloudflare Worker deployed"}' >/dev/null

      - name: Verify live routes and assets
        run: |
          base='https://truewords-review-sync.truewords-review-896be42e.workers.dev'
          sleep 20
          curl --fail --silent --show-error --retry 18 --retry-delay 5 --retry-all-errors "$base/api/health" -o health.json
          grep -q 'ok' health.json

          curl --fail --silent --show-error --retry 6 --retry-delay 3 --retry-all-errors "$base/sw.js" -o sw-live.js
          curl --fail --silent --show-error --retry 6 --retry-delay 3 --retry-all-errors "$base/review-v30.css" -o review-v30-live.css
          curl --fail --silent --show-error --retry 6 --retry-delay 3 --retry-all-errors "$base/review-v30-app.js" -o review-v30-live.js
          curl --fail --silent --show-error --retry 6 --retry-delay 3 --retry-all-errors "$base/vendor/embla-carousel.umd.js" -o embla-live.js

          grep -q 'truewords-review-pwa-server-v30' sw-live.js
          grep -Fq '.tw-embla-viewport' review-v30-live.css
          grep -Fq 'EmblaCarousel' review-v30-live.js
          grep -Fq 'EmblaCarousel' embla-live.js

          curl --silent --show-error -D review-headers.txt -o /dev/null "$base/review.html"
          grep -Eq '^HTTP/.* 302' review-headers.txt
          grep -Eqi '^location: /login.html' review-headers.txt

      - name: Mark live verification successful
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl --fail --silent --show-error -X POST \
            -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -d '{"state":"success","context":"truewords/review-v30-live","description":"Review v30 live checks passed"}' >/dev/null
          curl --fail --silent --show-error -X POST \
            -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -d '{"state":"success","context":"truewords/review-v30-deploy","description":"Review v30 deployed and live checks passed"}' >/dev/null

      - name: Mark deployment failed
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl --silent --show-error -X POST \
            -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -d '{"state":"failure","context":"truewords/review-v30-deploy","description":"Review v30 deployment or live checks failed"}' >/dev/null || true
