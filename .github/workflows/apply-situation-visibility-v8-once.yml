name: Apply situation visibility v8 once

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  patch:
    if: github.head_ref == 'agent/server-synchronization'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/server-synchronization
          fetch-depth: 0

      - name: Apply visibility patch
        run: node scripts/apply-situation-visibility-v8.mjs

      - name: Validate patch markers
        run: |
          node --check review.js
          grep -q 'situation-zone' review.js
          grep -q 'Teil der Situation' review.js
          grep -q 'Situation membership visibility' review.css
          grep -q 'review.js?v=8' review.html
          grep -q 'truewords-review-pwa-server-v7' sw.js

      - name: Commit patch
        run: |
          if git diff --quiet; then
            echo "Patch already applied"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add review.js review.css review.html sw.js
          git commit -m "Highlight messages belonging to each situation"
          git push origin HEAD:agent/server-synchronization
