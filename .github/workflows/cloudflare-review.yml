name: Deploy private Review Server

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: truewords-review-server
  cancel-in-progress: false

jobs:
  validate-and-deploy:
    runs-on: ubuntu-latest
    environment: review-server
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate required credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          PHILIPP_REVIEW_TOKEN: ${{ secrets.PHILIPP_REVIEW_TOKEN }}
          LENA_REVIEW_TOKEN: ${{ secrets.LENA_REVIEW_TOKEN }}
          ADMIN_REVIEW_TOKEN: ${{ secrets.ADMIN_REVIEW_TOKEN }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          test -n "$PHILIPP_REVIEW_TOKEN"
          test -n "$LENA_REVIEW_TOKEN"
          test -n "$ADMIN_REVIEW_TOKEN"

      - name: Install
        run: npm install

      - name: Validate source
        run: |
          npm run check
          npm run build
          test -f dist/index.html
          test -f dist/upload.html
          test -f dist/pilot-v2.js
          test -f dist/review.html
          test -f dist/review-boundaries.js
          test -f dist/review-precision.js
          test -f dist/review-precision.css
          test -f dist/review-cross-owner-fix.js
          test -f migrations/0001_review_sync.sql
          grep -q 'philena-2026-pilot-v2' wrangler.jsonc
          grep -q 'worker-review-precision.ts' wrangler.jsonc
          grep -q 'Nicht Teil dieser Situation' dist/review-precision.js
          grep -q 'sourceWasUnassigned' dist/review-cross-owner-fix.js
          grep -q 'boundarySituationId' dist/review-cross-owner-fix.js
          grep -q 'Rohchat und KI-Vorschläge hochladen' dist/upload.html
          grep -q 'KI-Vorselektionsdatei auswählen' dist/upload.html
          grep -q 'Weiter ohne Upload' dist/upload.html
          grep -q 'PRESELECTION_SITUATIONS = 28' dist/upload.js
          grep -q 'PRESELECTION_ASSIGNMENTS = 335' dist/upload.js
          grep -q 'pilot-v2-lossless-userfile' src/worker-source-integrity.ts
          ! grep -R "Philena_chat" dist src migrations scripts --exclude-dir=node_modules

      - name: Ensure workers.dev account subdomain
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          api="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/subdomain"
          status=$(curl --silent --show-error \
            --header "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            --output /tmp/workers-subdomain.json \
            --write-out '%{http_code}' \
            "$api")

          subdomain=""
          if [ "$status" = "200" ]; then
            subdomain=$(node -e "const fs=require('fs');const x=JSON.parse(fs.readFileSync('/tmp/workers-subdomain.json','utf8'));process.stdout.write(x.result?.subdomain||'')")
          fi

          if [ -z "$subdomain" ]; then
            candidate="truewords-review-${CLOUDFLARE_ACCOUNT_ID:0:8}"
            curl --fail --silent --show-error \
              --request PUT \
              --header "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
              --header 'Content-Type: application/json' \
              --data "{\"subdomain\":\"${candidate}\"}" \
              --output /tmp/workers-subdomain.json \
              "$api"
            subdomain=$(node -e "const fs=require('fs');const x=JSON.parse(fs.readFileSync('/tmp/workers-subdomain.json','utf8'));process.stdout.write(x.result?.subdomain||'')")
          fi

          test -n "$subdomain"
          echo "WORKERS_SUBDOMAIN=$subdomain" >> "$GITHUB_ENV"
          echo "REVIEW_SERVER_URL=https://truewords-review-sync.${subdomain}.workers.dev" >> "$GITHUB_ENV"

      - name: Deploy Worker and provision D1
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy

      - name: Configure private access tokens
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          PHILIPP_REVIEW_TOKEN: ${{ secrets.PHILIPP_REVIEW_TOKEN }}
          LENA_REVIEW_TOKEN: ${{ secrets.LENA_REVIEW_TOKEN }}
          ADMIN_REVIEW_TOKEN: ${{ secrets.ADMIN_REVIEW_TOKEN }}
        run: |
          printf '%s' "$PHILIPP_REVIEW_TOKEN" | npx wrangler secret put PHILIPP_REVIEW_TOKEN
          printf '%s' "$LENA_REVIEW_TOKEN" | npx wrangler secret put LENA_REVIEW_TOKEN
          printf '%s' "$ADMIN_REVIEW_TOKEN" | npx wrangler secret put ADMIN_REVIEW_TOKEN

      - name: Enable Worker on workers.dev
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          curl --fail --silent --show-error \
            --request POST \
            --header "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            --header 'Content-Type: application/json' \
            --data '{"enabled":true,"previews_enabled":false}' \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/scripts/truewords-review-sync/subdomain"

      - name: Apply D1 migrations
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler d1 migrations apply truewords-review-sync-db --remote

      - name: Verify deployed health endpoint
        run: |
          sleep 30
          curl --fail --silent --show-error \
            --retry 36 --retry-delay 5 --retry-all-errors \
            --connect-timeout 10 --max-time 20 \
            "${REVIEW_SERVER_URL}/api/health"
          echo
          echo "REVIEW_SERVER_URL=${REVIEW_SERVER_URL}"
