name: Deploy private Review Server

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: truewords-review-server
  cancel-in-progress: false

jobs:
  validate-and-deploy:
    runs-on: ubuntu-latest
    environment: review-server
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install
        run: npm install

      - name: Dump review data (never echoed — contains message text)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          ds="(SELECT id FROM review_datasets WHERE is_active = 1 LIMIT 1)"
          npx wrangler d1 execute truewords-review-sync-db --remote --json --command \
            "SELECT round, first_message_id, message_count FROM review_rounds ORDER BY round" > /tmp/rounds.json
          npx wrangler d1 execute truewords-review-sync-db --remote --json --command \
            "SELECT chunk_index, messages_json FROM review_chat_chunks WHERE dataset_id = $ds ORDER BY chunk_index" > /tmp/chunks.json
          npx wrangler d1 execute truewords-review-sync-db --remote --json --command \
            "SELECT round, reviewer, seam_message_id, mark FROM review_boundary_marks ORDER BY round" > /tmp/marks.json
          npx wrangler d1 execute truewords-review-sync-db --remote --json --command \
            "SELECT round, reviewer FROM review_round_submissions ORDER BY round" > /tmp/submissions.json
          echo "dump sizes (bytes, no content):"
          wc -c /tmp/rounds.json /tmp/chunks.json /tmp/marks.json /tmp/submissions.json

      - name: recentOpenQuestion lookback experiment (numbers only)
        run: node scripts/experiment-openquestion.mjs /tmp/rounds.json /tmp/chunks.json /tmp/marks.json /tmp/submissions.json
