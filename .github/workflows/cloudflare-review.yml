name: Deploy private Review Server

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: truewords-review-server
  cancel-in-progress: false

jobs:
  validate-and-deploy:
    runs-on: ubuntu-latest
    environment: review-server
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install
        run: npm install

      - name: Dump chunks (never echoed — contains message text)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx wrangler d1 execute truewords-review-sync-db --remote --json --command \
            "SELECT chunk_index, messages_json FROM review_chat_chunks
             WHERE dataset_id = (SELECT id FROM review_datasets WHERE is_active = 1 LIMIT 1)
             ORDER BY chunk_index" \
            > /tmp/chunks.json
          echo "dump size (bytes, no content):"
          wc -c /tmp/chunks.json

      - name: Pattern hit statistics (counts only, never text)
        run: node scripts/muster-statistik.mjs /tmp/chunks.json
