name: Deploy private Review Server

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: truewords-review-server
  cancel-in-progress: false

jobs:
  validate-and-deploy:
    if: github.event_name == 'workflow_dispatch' || github.head_ref == 'agent/server-synchronization'
    runs-on: ubuntu-latest
    environment: review-server
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate required credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          PHILIPP_REVIEW_TOKEN: ${{ secrets.PHILIPP_REVIEW_TOKEN }}
          LENA_REVIEW_TOKEN: ${{ secrets.LENA_REVIEW_TOKEN }}
          ADMIN_REVIEW_TOKEN: ${{ secrets.ADMIN_REVIEW_TOKEN }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          test -n "$PHILIPP_REVIEW_TOKEN"
          test -n "$LENA_REVIEW_TOKEN"
          test -n "$ADMIN_REVIEW_TOKEN"

      - name: Install
        run: npm install

      - name: Validate source
        run: |
          npm run check
          npm run build
          test -f dist/index.html
          test -f dist/admin.html
          test -f dist/server-sync.js
          test -f migrations/0001_review_sync.sql
          ! grep -R "Philena_chat" dist src migrations scripts --exclude-dir=node_modules

      - name: Ensure workers.dev account subdomain
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          api="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/subdomain"
          status=$(curl --silent --show-error \
            --header "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            --output /tmp/workers-subdomain.json \
            --write-out '%{http_code}' \
            "$api")

          subdomain=""
          if [ "$status" = "200" ]; then
            subdomain=$(node -e "const fs=require('fs');const x=JSON.parse(fs.readFileSync('/tmp/workers-subdomain.json','utf8'));process.stdout.write(x.result?.subdomain||'')")
          fi

          if [ -z "$subdomain" ]; then
            candidate="truewords-review-${CLOUDFLARE_ACCOUNT_ID:0:8}"
            curl --fail --silent --show-error \
              --request PUT \
              --header "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
              --header 'Content-Type: application/json' \
              --data "{\"subdomain\":\"${candidate}\"}" \
              --output /tmp/workers-subdomain.json \
              "$api"
            subdomain=$(node -e "const fs=require('fs');const x=JSON.parse(fs.readFileSync('/tmp/workers-subdomain.json','utf8'));process.stdout.write(x.result?.subdomain||'')")
          fi

          test -n "$subdomain"
          echo "WORKERS_SUBDOMAIN=$subdomain" >> "$GITHUB_ENV"
          echo "REVIEW_SERVER_URL=https://truewords-review-sync.${subdomain}.workers.dev" >> "$GITHUB_ENV"
          echo "workers.dev account subdomain is ready."

      - name: Deploy Worker and provision D1
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy

      - name: Configure private access tokens
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          PHILIPP_REVIEW_TOKEN: ${{ secrets.PHILIPP_REVIEW_TOKEN }}
          LENA_REVIEW_TOKEN: ${{ secrets.LENA_REVIEW_TOKEN }}
          ADMIN_REVIEW_TOKEN: ${{ secrets.ADMIN_REVIEW_TOKEN }}
        run: |
          printf '%s' "$PHILIPP_REVIEW_TOKEN" | npx wrangler secret put PHILIPP_REVIEW_TOKEN
          printf '%s' "$LENA_REVIEW_TOKEN" | npx wrangler secret put LENA_REVIEW_TOKEN
          printf '%s' "$ADMIN_REVIEW_TOKEN" | npx wrangler secret put ADMIN_REVIEW_TOKEN

      - name: Enable Worker on workers.dev
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          curl --fail --silent --show-error \
            --request POST \
            --header "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            --header 'Content-Type: application/json' \
            --data '{"enabled":true,"previews_enabled":false}' \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/scripts/truewords-review-sync/subdomain"

      - name: Apply D1 migrations
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler d1 migrations apply truewords-review-sync-db --remote

      - name: Verify deployed health endpoint
        run: |
          sleep 30
          curl --fail --silent --show-error \
            --retry 36 --retry-delay 5 --retry-all-errors \
            --connect-timeout 10 --max-time 20 \
            "${REVIEW_SERVER_URL}/api/health"
          echo
          echo "REVIEW_SERVER_URL=${REVIEW_SERVER_URL}"
