name: Deploy private Review Server

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: truewords-review-server
  cancel-in-progress: false

jobs:
  validate-and-deploy:
    runs-on: ubuntu-latest
    environment: review-server
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: TEMP diagnose Philipp vs Lena rows
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          echo "=== review_round_submissions ==="
          npx wrangler d1 execute truewords-review-sync-db --remote --json --command \
            "SELECT dataset_id, round, reviewer, submitted_at, length(submitted_at) AS len, typeof(submitted_at) AS ty FROM review_round_submissions ORDER BY round, reviewer"

          echo "=== review_boundary_marks ==="
          npx wrangler d1 execute truewords-review-sync-db --remote --json --command \
            "SELECT dataset_id, round, reviewer, seam_message_id, length(seam_message_id) AS len, typeof(seam_message_id) AS ty, mark, created_at, updated_at FROM review_boundary_marks ORDER BY round, reviewer, seam_message_id"

          echo "=== review_boundary_resolutions ==="
          npx wrangler d1 execute truewords-review-sync-db --remote --json --command \
            "SELECT dataset_id, round, seam_message_id, decision, note, decided_by, decided_at, length(decided_at) AS len, typeof(decided_at) AS ty FROM review_boundary_resolutions ORDER BY round"

          echo "=== review_rounds ==="
          npx wrangler d1 execute truewords-review-sync-db --remote --json --command \
            "SELECT dataset_id, round, first_message_id, message_count, typeof(first_message_id) AS ty FROM review_rounds ORDER BY round"

          echo "=== review_users ==="
          npx wrangler d1 execute truewords-review-sync-db --remote --json --command \
            "SELECT id, role, can_upload, is_active FROM review_users"

          echo "=== review_sessions (no token hashes, just shape) ==="
          npx wrangler d1 execute truewords-review-sync-db --remote --json --command \
            "SELECT user_id, expires_at, created_at, last_seen_at, length(token_hash) AS token_hash_len FROM review_sessions"
