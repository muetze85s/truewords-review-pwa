name: Deploy private Review Server

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: truewords-review-server
  cancel-in-progress: false

jobs:
  validate-and-deploy:
    runs-on: ubuntu-latest
    environment: review-server
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install
        run: npm install

      - name: Dataset inventory (aggregate numbers only)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx wrangler d1 execute truewords-review-sync-db --remote --json --command \
            "SELECT d.id, d.year, d.is_active, COUNT(c.chunk_index) AS chunks, SUM(c.message_count) AS messages
             FROM review_datasets d LEFT JOIN review_chat_chunks c ON c.dataset_id = d.id
             GROUP BY d.id, d.year, d.is_active ORDER BY d.id"

      - name: Dump chunks (never echoed — contains message text)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx wrangler d1 execute truewords-review-sync-db --remote --json --command \
            "SELECT chunk_index, messages_json FROM review_chat_chunks
             WHERE dataset_id = (SELECT id FROM review_datasets WHERE is_active = 1 LIMIT 1)
             ORDER BY chunk_index" \
            > /tmp/chunks.json
          echo "dump size (bytes, no content):"
          wc -c /tmp/chunks.json

      - name: Extract timestamps and gaps (payload encrypted — repo is public)
        run: |
          cat > /tmp/dump-public.pem <<'PEMEOF'
          -----BEGIN PUBLIC KEY-----
          MIIBojANBgkqhkiG9w0BAQEFAAOCAY8AMIIBigKCAYEA2tz6Z77ggPxBSGnL/gXI
          anV+KrFJr5jXVN3a05DV2c4p3GNp37evrO37xeb0IzBjqKTo+XDNKmUR9HWmDMRl
          IQrqjYgZ85yzzOCsXp/zFR6t+zav3Xt82VYbLywQMm/aY11q4e5CngLOaYOei1gF
          X92auBaBpsji6Ny9QjNeF06b9apTnvcEVqxYnWO7SUa+A9AxsEcOoAaGOA2KTVnd
          CogIdHGtnD0ycbA+eZpw8YZcC6MFNsUEfkRK+s3Lb7MqyXadLQxqmrGgjbF7vnzQ
          FIRpMf8l5DQ5KOZ8aoNH6nOkS6OR+QNAX755NY+H83MmhoietOwMCFKjkZtfv9+e
          RpfeRvpPlK72OPCFQyShPOUV+4SarBOaT946+8khPB4Ia+9wkbgkHcKLhJUevtLl
          0tQ4WdsLl8P6+vZuHe09MpSZNfohG/Sr6NAMofsbVYe/cauzBV+YPHukl396oMg+
          YqpEJh0QMUwbX19rmV+iEdJ/MRPy1jONPkSacWyb4RwnAgMBAAE=
          -----END PUBLIC KEY-----
          PEMEOF
          sed -i 's/^          //' /tmp/dump-public.pem
          node scripts/zeitstempel-from-d1.mjs /tmp/chunks.json /tmp/dump-public.pem
