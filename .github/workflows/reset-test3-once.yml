name: Reset Test 3 once

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/reset-test3-once.yml'

permissions:
  contents: read

concurrency:
  group: truewords-reset-test3-once
  cancel-in-progress: false

jobs:
  reset:
    runs-on: ubuntu-24.04
    environment: review-server
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate Cloudflare credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"

      - name: Prepare reset SQL
        run: |
          cat > reset-test3.sql <<'SQL'
          PRAGMA foreign_keys = ON;

          INSERT INTO review_analysis_versions (
            id, dataset_id, label, source, schema_version, parameters_json,
            annotations_json, is_active, created_at, updated_at
          )
          SELECT
            'test3-review-snapshot-before-reset-20260808',
            id,
            'Test 3 · Prüfstand vor Neustart am 08.08.2026',
            'manual-review-snapshot-before-user-reset',
            COALESCE(json_extract(annotations_json, '$.schemaVersion'), 'truewords-manual-segmentation/v2'),
            '{"reason":"user_requested_restart","archived":true}',
            annotations_json,
            0,
            CURRENT_TIMESTAMP,
            CURRENT_TIMESTAMP
          FROM review_datasets
          WHERE id = 'philena-2026-pilot-v3-unseen'
          ON CONFLICT(id) DO UPDATE SET
            annotations_json = excluded.annotations_json,
            parameters_json = excluded.parameters_json,
            updated_at = CURRENT_TIMESTAMP;

          UPDATE review_analysis_versions
          SET label = 'TrueWords-Segmentierungsalgorithmus V3 · 12 Situationen · Test 3',
              source = 'truewords-segmentation-v3-unseen',
              updated_at = CURRENT_TIMESTAMP
          WHERE id = 'pilot-v3-unseen-fullsource-owners'
            AND dataset_id = 'philena-2026-pilot-v3-unseen';

          DELETE FROM review_events
          WHERE dataset_id = 'philena-2026-pilot-v3-unseen';

          DELETE FROM review_import_sessions
          WHERE dataset_id = 'philena-2026-pilot-v3-unseen';

          UPDATE review_datasets
          SET annotations_json = (
                SELECT annotations_json
                FROM review_analysis_versions
                WHERE id = 'pilot-v3-unseen-fullsource-owners'
                  AND dataset_id = 'philena-2026-pilot-v3-unseen'
                LIMIT 1
              ),
              owners_json = json_extract((
                SELECT annotations_json
                FROM review_analysis_versions
                WHERE id = 'pilot-v3-unseen-fullsource-owners'
                  AND dataset_id = 'philena-2026-pilot-v3-unseen'
                LIMIT 1
              ), '$.owners'),
              revision = revision + 1,
              updated_at = CURRENT_TIMESTAMP
          WHERE id = 'philena-2026-pilot-v3-unseen'
            AND EXISTS (
              SELECT 1 FROM review_analysis_versions
              WHERE id = 'pilot-v3-unseen-fullsource-owners'
                AND dataset_id = 'philena-2026-pilot-v3-unseen'
            );

          INSERT INTO review_events (dataset_id, reviewer, action, payload_json)
          VALUES (
            'philena-2026-pilot-v3-unseen',
            'Admin',
            'test3_reset_to_algorithm_baseline',
            '{"reason":"user_requested_restart","baseline":"pilot-v3-unseen-fullsource-owners","algorithm":"TrueWords Segmentation V3"}'
          );
          SQL

      - name: Reset Test 3 in D1
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler d1 execute truewords-review-sync-db --remote --file reset-test3.sql

      - name: Verify clean Test 3 baseline
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx wrangler d1 execute truewords-review-sync-db --remote --json --command "
            SELECT
              id,
              json_array_length(json_extract(annotations_json, '$.situations')) AS situations,
              (SELECT count(*) FROM json_each(json_extract(annotations_json, '$.situations')) WHERE json_extract(value, '$.status') = 'open') AS open_situations,
              (SELECT count(*) FROM json_each(json_extract(annotations_json, '$.assignments'))) AS assignments,
              (SELECT count(*) FROM json_each(owners_json)) AS owners,
              (SELECT count(*) FROM review_events WHERE dataset_id = review_datasets.id) AS audit_events,
              revision
            FROM review_datasets
            WHERE id = 'philena-2026-pilot-v3-unseen';
          " > verify.json
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const payload = JSON.parse(fs.readFileSync('verify.json', 'utf8'));
          const groups = Array.isArray(payload) ? payload : [payload];
          const rows = groups.flatMap((group) => Array.isArray(group?.results) ? group.results : []);
          const row = rows[0];
          if (!row) throw new Error('Test-3-Datensatz wurde nicht gefunden.');
          if (Number(row.situations) !== 12) throw new Error(`Erwartet 12 Situationen, erhalten ${row.situations}`);
          if (Number(row.open_situations) !== 12) throw new Error(`Erwartet 12 offene Situationen, erhalten ${row.open_situations}`);
          if (Number(row.assignments) !== 335) throw new Error(`Erwartet 335 Zuordnungen, erhalten ${row.assignments}`);
          if (Number(row.owners) !== 12) throw new Error(`Erwartet 12 Owner, erhalten ${row.owners}`);
          if (Number(row.audit_events) !== 1) throw new Error(`Erwartet genau ein Reset-Auditereignis, erhalten ${row.audit_events}`);
          console.log(`TEST3_RESET_OK revision=${row.revision} situations=12 open=12 assignments=335 owners=12`);
          NODE
