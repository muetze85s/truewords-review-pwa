name: Deploy review stable scroll once

on:
  push:
    branches:
      - agent/server-synchronization
    paths:
      - '.github/workflows/deploy-review-stable-scroll-once.yml'

permissions:
  contents: write

concurrency:
  group: truewords-review-stable-scroll-once
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-24.04
    environment: review-server
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"

      - name: Validate current review build
        run: |
          npm install
          npm run check
          npm run build
          test -f dist/review-sidebar-follow.js
          grep -q 'review-sidebar-follow.js?v=1' dist/review.html
          grep -q 'Situationswechsel dürfen die Höhe des Chatverlaufs nicht verändern' dist/review.html
          grep -q 'truewords-review-pwa-server-v28' dist/sw.js

      - name: Deploy Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy

      - name: Verify live routes and assets
        run: |
          base='https://truewords-review-sync.truewords-review-896be42e.workers.dev'
          sleep 20
          curl --fail --silent --show-error --retry 18 --retry-delay 5 --retry-all-errors "$base/api/health" > health.json
          grep -q 'ok' health.json
          curl --fail --silent --show-error "$base/sw.js" | grep -q 'truewords-review-pwa-server-v28'
          curl --fail --silent --show-error "$base/review-sidebar-follow.js" | grep -q 'visual center'
          curl --silent --show-error -D review-headers.txt -o /dev/null "$base/review.html"
          grep -Eq '^HTTP/.* 302' review-headers.txt
          grep -Eqi '^location: /login.html' review-headers.txt

      - name: Record successful deployment
        run: |
          printf 'review-stable-scroll-live\n' > .github/review-stable-scroll-deploy-success
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/review-stable-scroll-deploy-success
          git commit -m 'Record successful stable scroll deployment'
          git push
