name: Export completed review evaluation once

on:
  push:
    branches:
      - agent/server-synchronization
    paths:
      - .github/workflows/export-review-evaluation-once.yml

permissions:
  contents: read

jobs:
  export-review-state:
    runs-on: ubuntu-latest
    environment: review-server
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install
        run: npm install

      - name: Export annotation-only state from D1
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          npx wrangler d1 execute truewords-review-sync-db --remote --json --command \
            "SELECT id, name, year, dataset_hash, annotations_json, owners_json, revision, updated_at FROM review_datasets WHERE id = 'philena-2026-pilot-v2' LIMIT 1" \
            > review-d1-result.json
          node --input-type=module <<'EOF'
          import fs from 'node:fs';
          const raw = JSON.parse(fs.readFileSync('review-d1-result.json', 'utf8'));
          const row = raw?.[0]?.results?.[0] || raw?.results?.[0];
          if (!row) throw new Error('ACTIVE_DATASET_NOT_FOUND');
          const annotations = JSON.parse(row.annotations_json);
          const owners = JSON.parse(row.owners_json || '{}');
          const output = {
            dataset: {
              id: row.id,
              name: row.name,
              year: row.year,
              datasetHash: row.dataset_hash,
              revision: row.revision,
              updatedAt: row.updated_at,
            },
            owners,
            annotations,
          };
          fs.writeFileSync('completed-review-state.json', JSON.stringify(output, null, 2));
          console.log(JSON.stringify({
            datasetId: row.id,
            revision: row.revision,
            situations: annotations.situations?.length || 0,
            assignments: Object.keys(annotations.assignments || {}).length,
            owners: Object.keys(owners).length,
          }));
          EOF
          rm review-d1-result.json

      - name: Upload annotation artifact
        uses: actions/upload-artifact@v4
        with:
          name: completed-review-state
          path: completed-review-state.json
          if-no-files-found: error
          retention-days: 3
