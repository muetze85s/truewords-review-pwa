name: Apply account timezone and TrueWords theme v10 once

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  patch:
    if: github.head_ref == 'agent/server-synchronization'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/server-synchronization
          fetch-depth: 0

      - name: Apply patch
        run: node scripts/apply-account-timezone-truewords-theme-v10.mjs

      - name: Validate patch markers
        run: |
          node --check review.js
          grep -q "Asia/Bangkok" review.js
          grep -q "Europe/Berlin" review.js
          grep -q "accountTimeZone" review.js
          grep -q "TrueWords product theme" review.css
          grep -q "review.js?v=10" review.html
          grep -q "portal-brand" login.html
          grep -q "portal-brand" upload.html
          grep -q "truewords-review-pwa-server-v9" sw.js

      - name: Commit patch
        run: |
          if git diff --quiet; then
            echo "Patch already applied"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add review.js review.css review.html login.html upload.html account-setup.html sw.js
          git commit -m "Use account timezone and TrueWords visual design"
          git push origin HEAD:agent/server-synchronization
