name: Deploy calm review palette once

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/deploy-calm-palette-once.yml

permissions:
  contents: read

concurrency:
  group: truewords-review-server
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: review-server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
      - name: Validate and build
        run: |
          npm install
          npm run check
          npm run build
          grep -q 'truewords-ui-theme.css?v=2' dist/review.html
          grep -q 'truewords-review-pwa-server-v19' dist/sw.js
      - name: Deploy Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy
      - name: Verify health
        run: |
          sleep 20
          curl --fail --silent --show-error \
            --retry 18 --retry-delay 5 --retry-all-errors \
            "https://truewords-review-sync.truewords-review-896be42e.workers.dev/api/health"
