name: Apply review v6 patch once

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  patch:
    if: github.head_ref == 'agent/server-synchronization'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/server-synchronization
          fetch-depth: 0

      - name: Apply patch
        run: node scripts/apply-review-v6-patch.mjs

      - name: Commit patch
        run: |
          if git diff --quiet; then
            echo "Patch already applied"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add review.js review.html sw.js
          git commit -m "Remove empty situations and preserve chronological list order"
          git push origin HEAD:agent/server-synchronization
