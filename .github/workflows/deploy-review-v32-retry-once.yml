name: Deploy review v32 retry once

on:
  push:
    branches:
      - agent/server-synchronization
    paths:
      - '.github/workflows/deploy-review-v32-retry-once.yml'

permissions:
  contents: read
  statuses: write

concurrency:
  group: truewords-review-v32-retry-once
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-24.04
    environment: review-server
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Mark build pending
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl --fail --silent --show-error -X POST \
            -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -d '{"state":"pending","context":"truewords/v32-build","description":"v32 build running"}' >/dev/null

      - name: Build verified worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          npm install
          npm run build
          npx wrangler deploy --dry-run
          grep -q 'review-v31.css?v=2' dist/review.html
          grep -q 'review-v31-ui.js?v=2' dist/review.html
          grep -q 'truewords-review-pwa-server-v32' dist/sw.js
          grep -q 'installEmblaViewportGuard' dist/review-v31-ui.js
          grep -q 'normalizeEmblaViewport' dist/review-v31-ui.js

      - name: Mark build success and deploy pending
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl --fail --silent --show-error -X POST \
            -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -d '{"state":"success","context":"truewords/v32-build","description":"v32 build passed"}' >/dev/null
          curl --fail --silent --show-error -X POST \
            -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -d '{"state":"pending","context":"truewords/v32-deploy","description":"v32 worker deploy running"}' >/dev/null

      - name: Deploy Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy

      - name: Mark deploy success and live check pending
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl --fail --silent --show-error -X POST \
            -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -d '{"state":"success","context":"truewords/v32-deploy","description":"v32 worker deployed"}' >/dev/null
          curl --fail --silent --show-error -X POST \
            -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -d '{"state":"pending","context":"truewords/v32-live","description":"v32 live verification running"}' >/dev/null

      - name: Verify live v32
        run: |
          base='https://truewords-review-sync.truewords-review-896be42e.workers.dev'
          sleep 20
          curl --fail --silent --show-error --retry 18 --retry-delay 5 --retry-all-errors "$base/api/health" -o health.json
          grep -q 'ok' health.json
          curl --fail --silent --show-error "$base/sw.js" -o live-sw.js
          curl --fail --silent --show-error "$base/review-v31.css?v=2" -o live-v31.css
          curl --fail --silent --show-error "$base/review-v31-ui.js?v=2" -o live-v31-ui.js
          curl --fail --silent --show-error "$base/vendor/embla-carousel.umd.js?v=8.6.0" -o live-embla.js
          grep -q 'truewords-review-pwa-server-v32' live-sw.js
          grep -q 'installEmblaViewportGuard' live-v31-ui.js
          grep -q 'normalizeEmblaViewport' live-v31-ui.js
          grep -q 'overflow:clip' live-v31.css
          grep -q 'EmblaCarousel' live-embla.js
          curl --silent --show-error -D review-headers.txt -o /dev/null "$base/review.html"
          grep -Eq '^HTTP/.* 302' review-headers.txt
          grep -Eqi '^location: /login.html' review-headers.txt

      - name: Mark live success
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl --fail --silent --show-error -X POST \
            -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -d '{"state":"success","context":"truewords/v32-live","description":"v32 live verification passed"}' >/dev/null

      - name: Mark workflow failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl --silent --show-error -X POST \
            -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -d '{"state":"failure","context":"truewords/v32-workflow","description":"v32 deployment workflow failed"}' >/dev/null || true
