name: Verify live account timezone theme v10 once

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    if: github.head_ref == 'agent/server-synchronization'
    runs-on: ubuntu-latest
    steps:
      - name: Verify deployed assets
        run: |
          set -eu
          base=https://truewords-review-sync.truewords-review-896be42e.workers.dev
          curl --fail --silent --show-error --retry 12 --retry-delay 5 --retry-all-errors "$base/api/health" > /tmp/health.json
          grep -q '"ok":true' /tmp/health.json

          curl --fail --silent --show-error --retry 12 --retry-delay 5 --retry-all-errors "$base/truewords-theme.css?v=10" > /tmp/theme.css
          grep -q -- '--teal: #087c70' /tmp/theme.css
          grep -q 'background: var(--rose-soft)' /tmp/theme.css

          curl --fail --silent --show-error --location --retry 12 --retry-delay 5 --retry-all-errors "$base/login.html?v=10" > /tmp/login.html
          grep -q 'portal-brand' /tmp/login.html
          grep -q 'portal.css?v=10' /tmp/login.html

          review_code=$(curl --silent --output /dev/null --write-out '%{http_code}' "$base/review.html?v=10")
          case "$review_code" in
            200|301|302|303|307|308) ;;
            *) echo "Unexpected review status: $review_code"; exit 1 ;;
          esac
          echo "HEALTH=PASS THEME=PASS LOGIN=PASS REVIEW_HTTP=$review_code"
