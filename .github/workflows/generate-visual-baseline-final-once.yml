name: Generate final visual baselines once

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/generate-visual-baseline-final-once.yml'

permissions:
  contents: read

jobs:
  baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npx playwright install --with-deps chromium
      - name: Generate Linux baselines
        run: npm run test:visual:update
      - uses: actions/upload-artifact@v4
        with:
          name: truewords-visual-baselines-final
          path: tests/visual/review.visual.spec.mjs-snapshots
          if-no-files-found: error
          retention-days: 2
