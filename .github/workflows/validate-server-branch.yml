name: Validate Review Server Branch

on:
  push:
    branches:
      - agent/server-synchronization
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install
        run: npm install

      - name: Check and build
        run: |
          npm run check
          npm run build
          test -f dist/index.html
          test -f dist/review.html
          test -f dist/review-v30.css
          test -f dist/review-v30-app.js
          test -f dist/vendor/embla-carousel.umd.js
          test -f dist/situation-info.html
          test -f dist/situation-info.css
          test -f dist/situation-info.js
          test -f dist/situation-quiz.html
          test -f dist/situation-quiz.css
          test -f dist/situation-quiz.js
          test -f dist/login.html
          test -f dist/login.js
          test -f dist/account-setup.html
          test -f dist/account-setup.js
          test -f dist/upload.html
          test -f dist/pilot-v2.js
          test -f dist/upload.js
          test -f dist/segmentation-v4.mjs
          test -f dist/portal.css
          test -f migrations/0004_email_auth.sql
          test -f migrations/0005_balance_pilot_review_owners.sql
          test -f migrations/0006_situation_quiz.sql

          grep -q 'review-v30.css' dist/review.html
          grep -q 'vendor/embla-carousel.umd.js' dist/review.html
          grep -q 'review-v30-app.js' dist/review.html
          ! grep -q 'review-navigation-fix.js' dist/review.html
          ! grep -q 'review-experience-v29.js' dist/review.html
          ! grep -q 'review-v2-app.js' dist/review.html
          grep -q 'Neue Situation ab hier' dist/review-v30-app.js
          grep -q 'truewordsNeedsCorrectedConfirmation' dist/review-v30-app.js
          grep -q 'data-situation-slider' dist/review-v30-app.js
          grep -q 'Bestätigung zurücknehmen' dist/review-v30-app.js
          grep -q 'EmblaCarousel' dist/review-v30-app.js
          grep -q 'showModal' dist/review-v30-app.js
          grep -q 'activeFromChatPosition' dist/review-v30-app.js
          grep -q '#F3F4F6' dist/review-v30.css
          grep -q '#121214' dist/review-v30.css
          grep -q '#1E1E22' dist/review-v30.css
          grep -q 'border-radius:var(--radius)' dist/review-v30.css
          grep -q 'tw-embla-viewport' dist/review-v30.css

          grep -q 'exactTestFilterWindow' src/worker-review.ts
          grep -q 'truewords-test-filter/v1' src/worker-review.ts
          grep -q 'precision_review_state_saved' src/worker-review-precision.ts
          grep -q 'review_situation_quiz_results' src/worker-situation-quiz.ts
          grep -q '/api/situation-quiz/submit' src/worker-situation-quiz.ts
          grep -q '/situation-quiz.html' src/worker-situation-quiz.ts
          grep -q '/situation-info.html' src/worker-situation-quiz.ts
          grep -q 'situation-info.html' dist/login.js
          grep -q 'Zum kurzen Situations-Quiz' dist/situation-info.js
          grep -q 'Lena, lass uns herausfinden, ob du Situationen richtig erkennst' dist/situation-quiz.html
          grep -q 'q10' dist/situation-quiz.js
          grep -q 'api/review/bootstrap' src/worker-review.ts

          grep -q 'philena-2026-pilot-v2' src/worker-source-integrity.ts
          grep -q 'philena-2026-pilot-v3-unseen' src/worker-source-integrity.ts
          grep -q 'ABORTED_LOSSY_PREPROCESSING' src/worker-source-integrity.ts
          grep -q 'V3_PRESELECTION_FILE_SHA256' src/worker-source-integrity.ts
          grep -q 'pilot-v3-unseen-fullsource-owners' src/worker-source-integrity.ts
          grep -q 'explicit-owner-assignment' src/worker-analysis.ts
          grep -q 'chronological-half-split' src/worker-analysis.ts

          grep -q 'Situation = Konversation' dist/situation-info.html
          grep -q 'Zeitpause ≠ Grenze' dist/situation-info.html
          grep -q 'TrueWords V4 setzt diese Regel erstmals direkt um' dist/situation-info.html
          grep -q 'Vier Stunden Antwortpause können eine Situation bleiben' dist/situation-info.html
          grep -q 'Konversationen sauber voneinander trennen' dist/login.html
          grep -q 'V4 auf einem neuen ungesehenen Abschnitt prüfen' dist/upload.html
          grep -q 'Test 3 bleibt unverändert erhalten' dist/upload.html
          grep -q 'Zeitabstand allein erzeugt keine Grenze' dist/upload.html
          ! grep -q 'preselection-file' dist/upload.html
          grep -q 'createTest4Preselection' dist/upload.js
          grep -q 'philena-2026-pilot-v4-unseen' dist/upload.js
          grep -q 'pilot-v4-unseen-fullsource-owners' dist/upload.js
          grep -q 'truewords-segmentation-v4-unseen' dist/upload.js
          grep -q 'timeGapAloneCreatesBoundary' dist/segmentation-v4.mjs
          grep -q 'direct_reply_continuation' dist/segmentation-v4.mjs
          grep -q 'open_question_continuation' dist/segmentation-v4.mjs
          grep -q 'TEST4_DATASET_ID' src/worker-source-integrity-v4.ts
          grep -q 'timeGapAloneCreatesBoundary' src/worker-source-integrity-v4.ts
          grep -q 'worker-source-integrity-v4.ts' wrangler.jsonc
          grep -q 'philena-2026-pilot-v4-unseen' wrangler.jsonc

          grep -q 'login-form' dist/login.html
          ! grep -R "Philena_chat" dist src migrations scripts --exclude-dir=node_modules

      - name: Test lossless 2026 preparation and placeholders
        run: |
          node --input-type=module <<'EOF'
          import fs from 'node:fs';
          import vm from 'node:vm';

          const context = {
            window: {}, Date, Intl, Number, String, Boolean, Array, Object,
            RegExp, Math, Set, Map,
          };
          vm.createContext(context);
          vm.runInContext(fs.readFileSync('pilot-v2.js', 'utf8'), context);
          const pilot = context.window.TRUEWORDS_PILOT_V2;
          if (!pilot) throw new Error('PILOT_V2_NOT_EXPOSED');

          const messages = Array.from({ length: pilot.EXPECTED_ENTRIES }, (_, index) => ({
            id: index + 1,
            type: 'message',
            date: index < 2494
              ? `2026-01-${String(1 + Math.floor(index / 100)).padStart(2, '0')}T${String(Math.floor(index / 60) % 24).padStart(2, '0')}:${String(index % 60).padStart(2, '0')}:00`
              : '2025-12-31T00:00:00',
            date_unixtime: String(1767225600 + index * 60),
            from: index % 2 ? 'Lena' : 'Philipp',
            from_id: index % 2 ? 'user-lena' : 'user-philipp',
            text: `Nachricht ${index + 1}`,
          }));
          messages[0] = { ...messages[0], photo: '(File not included.)', text: '' };
          messages[1] = { ...messages[1], text: 'Text bleibt unverändert' };
          messages[2] = { ...messages[2], type: 'service', action: 'phone_call', duration: 240, text: '' };
          messages[3] = { ...messages[3], media_type: 'video_file', duration_seconds: 43, text: '' };

          const prepared = pilot.prepareOriginalChat({ type: 'personal_chat', messages });
          if (prepared.chat.messages.length !== pilot.EXPECTED_ENTRIES) throw new Error('FULL_ENTRY_COUNT_CHANGED');
          if (prepared.chat.truewordsTimelinePreservation.silentLosses !== 0) throw new Error('SILENT_LOSS');
          if (prepared.reviewEvents.length !== 2494) throw new Error(`REVIEW_YEAR_COUNT_WRONG:${prepared.reviewEvents.length}`);
          if (prepared.reviewEvents[0].text !== '[Bild gesendet]') throw new Error('PHOTO_PLACEHOLDER_WRONG');
          if (prepared.reviewEvents[1].text !== 'Text bleibt unverändert') throw new Error('TEXT_CHANGED');
          if (prepared.reviewEvents[2].text !== '[Anruf · 4 Min.]') throw new Error(`CALL_PLACEHOLDER_WRONG:${prepared.reviewEvents[2].text}`);
          if (prepared.reviewEvents[3].text !== '[Video gesendet · 43 Sek.]') throw new Error('VIDEO_PLACEHOLDER_WRONG');
          EOF

      - name: Wrangler dry run
        run: npx wrangler deploy --dry-run
