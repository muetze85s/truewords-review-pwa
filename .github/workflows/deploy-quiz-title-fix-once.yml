name: Deploy corrected Lena quiz title once

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/deploy-quiz-title-fix-once.yml'

permissions:
  contents: read

concurrency:
  group: truewords-review-quiz-title-fix-once
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: review-server
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"

      - name: Validate and build
        run: |
          npm install
          npm run check
          npm run build
          grep -q 'Lena, lass uns herausfinden, ob du Situationen richtig erkennst' dist/situation-quiz.html
          test -f dist/review-v2-timeline.js
          test -f dist/review-v2-timeline.css

      - name: Deploy Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy

      - name: Verify health
        run: |
          sleep 20
          curl --fail --silent --show-error --retry 18 --retry-delay 5 --retry-all-errors \
            'https://truewords-review-sync.truewords-review-896be42e.workers.dev/api/health'
