name: Renumber completed review situations once

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/renumber-completed-review-once.yml

permissions:
  contents: read

jobs:
  renumber:
    runs-on: ubuntu-latest
    environment: review-server
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install
        run: npm install

      - name: Export current state
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          npx wrangler d1 execute truewords-review-sync-db --remote --json --command \
            "SELECT id, annotations_json, owners_json, revision FROM review_datasets WHERE id = 'philena-2026-pilot-v2' LIMIT 1" \
            > current-state.json

      - name: Build guarded renumbering transaction
        run: |
          node --input-type=module <<'EOF'
          import fs from 'node:fs';
          const raw = JSON.parse(fs.readFileSync('current-state.json', 'utf8'));
          const row = raw?.[0]?.results?.[0] || raw?.results?.[0];
          if (!row) throw new Error('DATASET_NOT_FOUND');
          const annotations = JSON.parse(row.annotations_json);
          const owners = JSON.parse(row.owners_json || '{}');
          const situations = [...(annotations.situations || [])].sort((a, b) => Number(a.id) - Number(b.id));
          if (situations.length !== 22) throw new Error(`EXPECTED_22_SITUATIONS_FOUND_${situations.length}`);
          if (situations.some((item) => !['confirmed', 'corrected'].includes(String(item.status)))) {
            throw new Error('REVIEW_NOT_COMPLETED');
          }

          const oldIds = situations.map((item) => Number(item.id));
          const alreadySequential = oldIds.every((id, index) => id === index + 1);
          const mapping = Object.fromEntries(oldIds.map((id, index) => [String(id), index + 1]));
          const mapId = (value) => mapping[String(value)] || Number(value) || value;

          if (!alreadySequential) {
            annotations.situations = situations.map((item, index) => {
              const id = index + 1;
              const label = String(item.label || '')
                .replace(/V2\s+\d+/iu, `V2 ${String(id).padStart(2, '0')}`);
              return { ...item, id, label, renumberedFrom: Number(item.id) };
            });
            annotations.assignments = Object.fromEntries(
              Object.entries(annotations.assignments || {}).map(([messageId, situationId]) => [messageId, mapId(situationId)]),
            );
            if (annotations.messageOverrides && typeof annotations.messageOverrides === 'object') {
              annotations.messageOverrides = Object.fromEntries(
                Object.entries(annotations.messageOverrides).map(([messageId, override]) => [
                  messageId,
                  override && typeof override === 'object'
                    ? { ...override, situationId: mapId(override.situationId) }
                    : override,
                ]),
              );
            }
            annotations.events = Array.isArray(annotations.events) ? annotations.events : [];
            annotations.events.push({
              type: 'situation_ids_renumbered',
              mapping,
              previousRevision: Number(row.revision),
              at: new Date().toISOString(),
            });
            annotations.events = annotations.events.slice(-2000);
          }

          const nextOwners = Object.fromEntries(
            Object.entries(owners)
              .filter(([oldId]) => mapping[oldId])
              .map(([oldId, reviewer]) => [String(mapping[oldId]), reviewer]),
          );

          const escapeSql = (value) => JSON.stringify(value).replaceAll("'", "''");
          const sql = alreadySequential
            ? 'SELECT 1;'
            : `UPDATE review_datasets\nSET annotations_json = '${escapeSql(annotations)}',\n    owners_json = '${escapeSql(nextOwners)}',\n    revision = revision + 1,\n    updated_at = datetime('now')\nWHERE id = 'philena-2026-pilot-v2' AND revision = ${Number(row.revision)};`;
          fs.writeFileSync('renumber.sql', sql);
          fs.writeFileSync('renumber-summary.json', JSON.stringify({
            datasetId: row.id,
            previousRevision: Number(row.revision),
            alreadySequential,
            mapping,
            situations: 22,
            assignments: Object.keys(annotations.assignments || {}).length,
            owners: Object.keys(nextOwners).length,
          }, null, 2));
          EOF

      - name: Apply renumbering
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler d1 execute truewords-review-sync-db --remote --file renumber.sql

      - name: Verify sequential state
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx wrangler d1 execute truewords-review-sync-db --remote --json --command \
            "SELECT annotations_json, owners_json, revision FROM review_datasets WHERE id = 'philena-2026-pilot-v2' LIMIT 1" \
            > verified-state.json
          node --input-type=module <<'EOF'
          import fs from 'node:fs';
          const raw = JSON.parse(fs.readFileSync('verified-state.json', 'utf8'));
          const row = raw?.[0]?.results?.[0] || raw?.results?.[0];
          const annotations = JSON.parse(row.annotations_json);
          const owners = JSON.parse(row.owners_json || '{}');
          const ids = [...annotations.situations].sort((a, b) => a.id - b.id).map((item) => item.id);
          if (ids.length !== 22 || ids.some((id, index) => id !== index + 1)) throw new Error('RENUMBER_VERIFY_FAILED');
          if (Object.keys(owners).length !== 22) throw new Error('OWNER_CLEANUP_FAILED');
          console.log(JSON.stringify({ revision: row.revision, ids, owners: Object.keys(owners).length }));
          EOF

      - name: Upload renumbering summary
        uses: actions/upload-artifact@v4
        with:
          name: renumber-summary
          path: renumber-summary.json
          retention-days: 3
