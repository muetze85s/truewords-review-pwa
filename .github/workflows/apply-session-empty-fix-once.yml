name: Apply session and empty situation fix once

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  patch:
    if: github.head_ref == 'agent/server-synchronization'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/server-synchronization
          fetch-depth: 0

      - name: Apply patch
        run: node scripts/apply-session-empty-fix.mjs

      - name: Validate patch
        run: |
          grep -q "tw_review_session_v2" src/worker-auth-fast.ts
          grep -q "removeEmptySituations" review.js
          grep -q "removedEmptySituationIds" src/worker-d1.ts
          grep -q "review.js?v=7" review.html

      - name: Commit patch
        run: |
          if git diff --quiet; then
            echo "Patch already applied"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/worker-auth-fast.ts src/worker-portal.ts src/worker-chat-stream.ts src/worker-d1.ts review.js review.html sw.js
          git commit -m "Expire login with browser session and prune empty situations"
          git push origin HEAD:agent/server-synchronization
