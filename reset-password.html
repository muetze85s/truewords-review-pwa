<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="TW Prüfstand">
<link rel="apple-touch-icon" href="./icon-192.png">
  <meta name="theme-color" content="#f6f2ec">
  <meta name="robots" content="noindex,nofollow">
  <title>TrueWords · Passwort zurücksetzen</title>
  <link rel="stylesheet" href="./portal.css?v=10">
</head>
<body>
  <main class="page">
    <section class="login-shell card">
      <div class="portal-brand">
        <span class="truewords-logo" aria-hidden="true"><i></i><b></b></span>
        <span><strong>TrueWords</strong><small>Gemeinsame Prüfung</small></span>
      </div>
      <div class="eyebrow">Nur ein Konto</div>
      <h1>Passwort zurücksetzen</h1>
      <p class="intro">Setzt ausschließlich das Passwort der gewählten Person neu. Das andere Konto und seine Sitzungen bleiben unverändert.</p>

      <form id="reset-form">
        <label>
          <span>Admin-Zugangscode</span>
          <input id="admin-token" type="password" autocomplete="off" required>
        </label>
        <label>
          <span>Konto</span>
          <select id="role" required>
            <option value="Philipp">Philipp</option>
            <option value="Lena">Lena</option>
          </select>
        </label>
        <label>
          <span>Neues Passwort</span>
          <input id="new-password" type="password" minlength="12" autocomplete="new-password" required>
        </label>
        <button id="submit" class="primary" type="submit">Passwort setzen</button>
      </form>

      <div id="status" class="status" role="status" aria-live="polite">Noch nicht zurückgesetzt.</div>
      <p class="muted" style="margin-top:12px;font-size:12px">Meldet nur die gewählte Person ab; das andere Konto bleibt angemeldet.</p>
    </section>
  </main>
  <script src="./reset-password.js"></script>
</body>
</html>
