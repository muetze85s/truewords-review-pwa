<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="robots" content="noindex,nofollow">
  <title>TrueWords · Review V2 Prototyp</title>
  <link rel="stylesheet" href="./review-v2-situation.css">
  <link rel="stylesheet" href="./review-v2-timeline.css">
  <style>html,body{margin:0;height:100%;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}</style>
</head>
<body>
  <div id="review-v2"></div>
  <script src="./review-v2-situation.js"></script>
  <script src="./review-v2-timeline.js"></script>
  <script>
    const situations = [
      {
        id: '1', status: 'confirmed', owner: 'Philipp', startDate: '30.04.',
        details: { classification: 'Organisation', direction: 'Philipp → Lena', patterns: ['Abstimmung'] },
      },
      {
        id: '2', status: 'confirmed', owner: 'Philipp', startDate: '01.05.',
        details: {
          classification: 'Konfliktgespräch',
          direction: 'Philipp → Lena',
          patterns: ['Rechtfertigung', 'Rückzug'],
          topics: ['Planung', 'altes Thema'],
          startingConcern: 'Terminabstimmung',
          course: 'Themenwechsel, Rückkehr zum Ausgangsanliegen',
          outcome: 'offen',
        },
      },
      {
        id: '3', status: 'open', owner: 'Lena', startDate: '02.05.',
        details: { classification: 'Alltag', direction: 'Lena → Philipp', patterns: ['Nachfrage'] },
      },
      {
        id: '4', status: 'corrected', owner: 'Lena', startDate: '03.05.',
        details: { classification: 'Planung', direction: 'gemeinsam', patterns: ['Klärung'] },
      },
    ];

    const messages = [];
    let id = 1000;
    function add(situationId, speaker, time, text, dateLabel) {
      messages.push({ id: String(id++), situationId, speaker, time, text, dateLabel });
    }

    add('1', 'Philipp', '18:05', 'Wann wollen wir morgen los?', '30.04.');
    add('1', 'Lena', '18:07', 'Gegen zehn wäre für mich gut.', '30.04.');
    add('1', 'Philipp', '18:11', 'Okay, dann plane ich zehn Uhr ein.', '30.04.');

    add('2', 'Philipp', '12:41', 'Wann sollen wir das mit dem Termin endgültig festmachen?', '01.05.');
    add('2', 'Lena', '12:45', 'Ich wollte erst noch wissen, ob Montag wirklich klappt.', '01.05.');
    add('2', 'Philipp', '12:48', 'Montag klappt. Aber wegen vorgestern ist noch etwas offen.', '01.05.');
    add('2', 'Lena', '12:52', 'Was genau meinst du?', '01.05.');
    add('2', 'Philipp', '13:01', 'Dass wir das Gespräch einfach abgebrochen haben.', '01.05.');
    add('2', 'Lena', '13:08', 'Dann lass uns das jetzt kurz klären.', '01.05.');
    add('2', 'Philipp', '13:22', 'Okay. Danach können wir den Montag festhalten.', '01.05.');
    add('2', 'Lena', '13:35', 'Montag zehn Uhr passt.', '01.05.');

    add('3', 'Lena', '09:04', 'Hast du das Paket schon gesehen?', '02.05.');
    add('3', 'Philipp', '09:08', 'Noch nicht, ich schaue gleich nach.', '02.05.');
    add('3', 'Lena', '10:40', 'Der Fahrer ist jetzt hier.', '02.05.');
    add('3', 'Philipp', '10:43', 'Stell es bitte vor die Tür.', '02.05.');
    add('3', 'Lena', '10:45', 'Erledigt.', '02.05.');

    add('4', 'Lena', '17:02', 'Freitag bis Montag fürs Hotel?', '03.05.');
    add('4', 'Philipp', '17:05', 'Ja, das passt.', '03.05.');
    add('4', 'Lena', '17:08', 'Dann suche ich nach den Preisen.', '03.05.');
    add('4', 'Philipp', '17:20', 'Schick mir zwei oder drei Optionen.', '03.05.');
    add('4', 'Lena', '17:31', 'Mache ich.', '03.05.');

    window.reviewV2Prototype = new window.TRUEWORDS_REVIEW_V2_TIMELINE.ReviewV2Timeline(
      document.getElementById('review-v2'),
      { situations, messages },
      { activeId: '2', onChange: (change) => { window.reviewV2LastChange = change; } },
    );
  </script>
</body>
</html>
