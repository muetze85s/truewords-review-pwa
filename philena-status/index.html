<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>PHILENA Live Status</title>
<style>
:root{color-scheme:light dark;--bg:#0f1115;--card:#171a21;--line:#2a2f3a;--text:#f4f6f8;--muted:#9ca6b4;--ok:#46c37b;--run:#e6b34a;--wait:#7f8a99;--accent:#20B8B5}
*{box-sizing:border-box}body{margin:0;font:14px/1.45 system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg);color:var(--text)}main{max-width:1180px;margin:auto;padding:20px}.head{display:flex;gap:12px;justify-content:space-between;align-items:flex-start;flex-wrap:wrap}.pill{border:1px solid var(--line);border-radius:999px;padding:6px 10px;color:var(--muted)}h1{font-size:28px;margin:0 0 4px}.sub{color:var(--muted)}.bottleneck{margin:16px 0;padding:14px 16px;border:1px solid var(--line);border-radius:14px;background:var(--card)}.package{margin:18px 0}.package h2{font-size:20px;margin:0 0 10px}.grid{display:grid;grid-template-columns:190px 135px 190px 1fr;border:1px solid var(--line);border-radius:14px;overflow:hidden;background:var(--card)}.cell{padding:11px 12px;border-bottom:1px solid var(--line)}.grid>.cell:nth-last-child(-n+4){border-bottom:0}.headcell{font-weight:700;background:rgba(255,255,255,.03)}.status{font-weight:700}.ok{color:var(--ok)}.run{color:var(--run)}.wait{color:var(--wait)}.changed{animation:flash 1.2s ease}@keyframes flash{0%{background:rgba(32,184,181,.18)}100%{background:transparent}}.foot{margin-top:22px;color:var(--muted);font-size:12px}.error{color:#ff8c8c}
@media(max-width:760px){main{padding:14px}.grid{display:block}.headcell{display:none}.cell{border-bottom:0;padding:7px 12px}.cell.station{font-weight:700;padding-top:13px;border-top:1px solid var(--line)}.grid>.cell.station:first-child{border-top:0}.cell.when:before{content:"Wann: ";color:var(--muted)}.cell.detail{padding-bottom:13px}.cell.detail:before{content:"Was / Warum: ";color:var(--muted)}}
</style>
</head>
<body>
<main>
<div class="head"><div><h1>PHILENA Live Status</h1><div class="sub">Globales Situationsinventar</div></div><div class="pill" id="updated">lädt…</div></div>
<div class="bottleneck"><strong>Engpass auf einen Blick</strong><div id="bottleneck">lädt…</div></div>
<div id="packages"></div>
<div class="foot">Live-Quelle: GitHub · Aktualisierung alle 5 Sekunden · Zeitzone Asia/Bangkok</div>
</main>
<script>
const DATA_URL='https://raw.githubusercontent.com/muetze85s/truewords-review-pwa/main/philena-status/status.json';
const stationNames={claude_generator:'Claude Generator',codex_qa:'Codex QA',work_qa:'Work-QA',chatgpt_endadjudikation:'ChatGPT-Endadjudikation',materialisierung:'Materialisierung'};
let lastStamp=null;
function cls(s){return s==='erledigt!'?'ok':s==='wird bearbeitet'?'run':'wait'}
function localTime(utc){if(!utc)return 'Stand: unbekannt';try{return 'Stand: '+new Intl.DateTimeFormat('de-DE',{timeZone:'Asia/Bangkok',day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit',second:'2-digit'}).format(new Date(utc))+' Uhr'}catch{return 'Stand: '+utc}}
async function load(){
 const r=await fetch(DATA_URL+'?ts='+Date.now(),{cache:'no-store'}); if(!r.ok) throw new Error('Live-Status nicht erreichbar');
 const d=await r.json(); const changed=lastStamp!==null&&lastStamp!==d.updated_at_utc; lastStamp=d.updated_at_utc;
 const up=document.getElementById('updated'); up.textContent=localTime(d.updated_at_utc); up.className='pill'+(changed?' changed':'');
 document.getElementById('bottleneck').textContent=d.bottleneck||'—';
 const root=document.getElementById('packages'); root.innerHTML='';
 Object.keys(d.packages||{}).sort().forEach(p=>{
  const sec=document.createElement('section'); sec.className='package';
  const h=document.createElement('h2'); h.textContent='P'+p; sec.appendChild(h);
  const g=document.createElement('div'); g.className='grid';
  ['Station','Status','Wann','Was / Warum'].forEach(x=>{const c=document.createElement('div');c.className='cell headcell';c.textContent=x;g.appendChild(c)});
  (d.station_order||Object.keys(stationNames)).forEach(k=>{const s=d.packages[p]?.[k]; if(!s)return;
   const a=document.createElement('div');a.className='cell station';a.textContent=stationNames[k]||k;g.appendChild(a);
   const b=document.createElement('div');b.className='cell status '+cls(s.status);b.textContent=s.status;g.appendChild(b);
   const c=document.createElement('div');c.className='cell when';c.textContent=s.when||'—';g.appendChild(c);
   const e=document.createElement('div');e.className='cell detail';e.textContent=s.what_why||'—';g.appendChild(e);
  }); sec.appendChild(g); root.appendChild(sec);
 });
}
async function tick(){try{await load()}catch(e){const b=document.getElementById('bottleneck');b.textContent=e.message;b.classList.add('error')}}
tick(); setInterval(tick,5000); document.addEventListener('visibilitychange',()=>{if(!document.hidden)tick()}); window.addEventListener('focus',tick);
</script>
</body>
</html>
