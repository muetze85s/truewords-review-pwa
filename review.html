<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#F3F4F6">
  <meta name="robots" content="noindex,nofollow">
  <title>TrueWords · Situationen prüfen</title>
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="./review-v2-app.css?v=1">
  <style>
    .tw-progress-ring{background:transparent!important}.tw-progress-ring:after{display:none!important}
    .tw-chat-stream{padding-bottom:max(360px,52vh)!important}
    .tw-sit-check{cursor:pointer}
    .tw-situation[data-status="confirmed"] .tw-sit-check,.tw-situation[data-status="corrected"] .tw-sit-check{background:var(--confirmed);border-color:var(--confirmed);color:#fff}
    .tw-confirm.done{background:var(--unclear)!important;color:#fff!important;border:1px solid var(--unclear)!important}
    .tw-message-wrap.philipp .tw-message{background:rgba(53,190,180,.18)!important}
    .tw-message-wrap.lena .tw-message{background:rgba(242,108,131,.16)!important}
    .tw-message-wrap.is-active.philipp .tw-message{background:rgba(53,190,180,.30)!important}
    .tw-message-wrap.is-active.lena .tw-message{background:rgba(242,108,131,.27)!important}
    .tw-message-wrap.is-selected:not(.is-active) .tw-message-menu{display:none!important}

    /* Situationswechsel dürfen die Höhe des Chatverlaufs nicht verändern.
       Grenz- und Abschlussbereiche behalten deshalb immer ihren Platz; nur ihre
       Bedienung wird bei der aktiven Situation vollständig sichtbar. */
    .tw-boundary{display:flex!important;min-height:44px;margin:7px 4px;padding:7px 10px;opacity:.16;pointer-events:none}
    .tw-boundary .tw-boundary-actions{visibility:hidden}
    .tw-boundary.is-active{opacity:1;pointer-events:auto}
    .tw-boundary.is-active .tw-boundary-actions{visibility:visible}
    .tw-end-card{display:flex!important;min-height:58px;margin:7px 0 22px;padding:10px 12px;opacity:.18;pointer-events:none}
    .tw-end-card .tw-confirm,.tw-end-card .tw-sit-status{visibility:hidden}
    .tw-end-card.is-active{opacity:1;pointer-events:auto}
    .tw-end-card.is-active .tw-confirm,.tw-end-card.is-active .tw-sit-status{visibility:visible}

    html[data-theme="dark"] .tw-situation.is-active{background:#303038!important}
    html[data-theme="dark"] .tw-message-wrap.philipp .tw-message{background:rgba(53,190,180,.25)!important}
    html[data-theme="dark"] .tw-message-wrap.lena .tw-message{background:rgba(242,108,131,.23)!important}
    html[data-theme="dark"] .tw-message-wrap.is-active.philipp .tw-message{background:rgba(53,190,180,.40)!important}
    html[data-theme="dark"] .tw-message-wrap.is-active.lena .tw-message{background:rgba(242,108,131,.37)!important}
    @media(max-width:840px){.tw-chat-stream{padding-bottom:max(430px,62vh)!important}}
  </style>
  <script src="./truewords-user-theme.js?v=1"></script>
  <script src="./review-navigation-fix.js?v=4" defer></script>
  <script src="./review-sidebar-follow.js?v=1" defer></script>
  <script src="./review-v2-app.js?v=1" defer></script>
  <script src="./review-v2-events.js?v=1" defer></script>
</head>
<body>
  <div id="review-app">
    <main class="tw-loading" aria-live="polite">
      <section class="tw-loading-card">
        <div class="tw-loading-mark">TW</div>
        <h1>Prüfstand wird geladen</h1>
        <p>Situationen, vollständiger Prüfverlauf und Korrekturen werden synchronisiert.</p>
        <div class="tw-loading-bar" aria-hidden="true"></div>
      </section>
    </main>
  </div>
</body>
</html>
