<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#F3F4F6">
  <meta name="robots" content="noindex,nofollow">
  <title>TrueWords · Situationen prüfen</title>
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="./review-v2-app.css?v=1">
  <style>
    .tw-progress-ring{background:transparent!important}.tw-progress-ring:after{display:none!important}
    .tw-chat-stream{padding-bottom:max(360px,52vh)!important}
    .tw-sit-check{cursor:pointer}
    .tw-situation[data-status="confirmed"] .tw-sit-check,.tw-situation[data-status="corrected"] .tw-sit-check{background:var(--confirmed);border-color:var(--confirmed);color:#fff}
    .tw-confirm.done{background:var(--unclear)!important;color:#fff!important;border:1px solid var(--unclear)!important}
    .tw-message-wrap.is-selected:not(.is-active) .tw-message-menu{display:none!important}
    @media(max-width:840px){.tw-chat-stream{padding-bottom:max(430px,62vh)!important}}
  </style>
  <link rel="stylesheet" href="./review-redesign-v29.css?v=1">
  <script src="./truewords-user-theme.js?v=1"></script>
  <script src="./review-navigation-fix.js?v=5" defer></script>
  <script src="./review-v2-app.js?v=1" defer></script>
  <script src="./review-v2-events.js?v=1" defer></script>
  <script src="./review-experience-v29.js?v=1" defer></script>
</head>
<body>
  <div id="review-app">
    <main class="tw-loading" aria-live="polite">
      <section class="tw-loading-card">
        <div class="tw-loading-mark">TW</div>
        <h1>Prüfstand wird geladen</h1>
        <p>Situationen, vollständiger Prüfverlauf und Korrekturen werden synchronisiert.</p>
        <div class="tw-loading-bar" aria-hidden="true"></div>
      </section>
    </main>
  </div>
</body>
</html>
